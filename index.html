                'it11-8': {
                    title: 'IT-11 - Meeting 8',
                    subtitle: 'Memahami CSS Box Model',
                    tabs: [
                        { id: 'opening', name: 'Opening', content: openingTabContent },
                        { id: 'it11-8-warmup', name: 'Pemanasan', content: `
                            <h4>Setiap Elemen adalah Sebuah Kotak</h4>
                            <p>Bayangkan Anda memiliki sebuah foto yang ingin Anda pajang di dinding. Apa saja yang Anda butuhkan?</p>
                            <ul class="list-disc list-inside mt-4 space-y-2">
                                <li><strong>Foto itu sendiri (Konten):</strong> Ini adalah hal utama yang ingin Anda tampilkan.</li>
                                <li><strong>Ruang Kosong antara Foto dan Bingkai (Padding):</strong> Agar foto tidak menempel langsung ke bingkai, Anda memberinya sedikit ruang napas di sekelilingnya.</li>
                                <li><strong>Bingkai Foto (Border):</strong> Bingkai yang mengelilingi foto, memberikan batas yang jelas dan bisa dihias.</li>
                                <li><strong>Jarak antara Bingkai dengan Bingkai Lain di Dinding (Margin):</strong> Anda tidak akan menempelkan beberapa bingkai foto saling berdempetan, bukan? Anda memberi jarak di antara mereka.</li>
                            </ul>
                            <p class="mt-4">Prinsip ini sama persis dengan cara browser melihat setiap elemen di halaman web Anda. Setiap <code>&lt;h1&gt;</code>, <code>&lt;p&gt;</code>, dan <code>&lt;div&gt;</code> dianggap sebagai sebuah kotak (box) yang memiliki empat lapisan ini. Inilah yang disebut <strong>CSS Box Model</strong>.</p>
                        `},
                        { id: 'it11-8-topic1', name: 'Lapisan Box Model', content: `
                            <h4>Mengupas Lapisan Box Model</h4>
                            <p>Memahami Box Model adalah kunci untuk mengontrol tata letak (layout) halaman web secara presisi. Mari kita bedah setiap lapisannya.</p>
                            <img src="https://miro.medium.com/1*eofyOWN5RYXmLGbiooBM7Q.png" alt="CSS Box Model Diagram" class="my-6 bg-white p-4 rounded-lg">
                            <ul class="list-disc list-inside mt-4 space-y-2">
                                <li><strong>Content:</strong> Bagian inti dari kotak, tempat teks dan gambar Anda muncul. Ukurannya ditentukan oleh properti <code>width</code> dan <code>height</code>.</li>
                                <li><strong>Padding:</strong> Area transparan yang membersihkan ruang di sekitar konten. Ini seperti ruang kosong di dalam bingkai.</li>
                                <li><strong>Border:</strong> Bingkai yang mengelilingi padding dan konten. Anda bisa mengatur ketebalan, gaya, dan warnanya.</li>
                                <li><strong>Margin:</strong> Area transparan di luar bingkai. Ini adalah properti yang mendorong elemen lain menjauh, menciptakan ruang antar elemen.</li>
                            </ul>
                        `},
                        { id: 'it11-8-topic2', name: 'Properti Box Model', content: `
                            <h4>Properti-Properti Box Model</h4>
                            <p>Mari kita lihat properti CSS yang mengontrol setiap lapisan.</p>
                            <h5 class="font-semibold mt-6">Content (width & height)</h5>
                            <p>Properti ini mengatur ukuran area konten.</p>
                            <pre><code>div {
  width: 300px;
  height: 200px;
  background-color: lightblue;
}</code></pre>
                            <h5 class="font-semibold mt-6">Padding</h5>
                            <p>Memberi ruang di dalam elemen. Anda bisa mengaturnya untuk semua sisi sekaligus atau satu per satu.</p>
                            <pre><code>.box-dengan-padding {
  /* 15px padding di semua sisi (atas, kanan, bawah, kiri) */
  padding: 15px;
  
  /* Atau secara spesifik */
  padding-top: 10px;
  padding-right: 20px;
  padding-bottom: 10px;
  padding-left: 20px;
  
  border: 1px solid black;
  background-color: lightgreen;
}</code></pre>
                            <h5 class="font-semibold mt-6">Border</h5>
                            <p>Membuat bingkai di sekeliling elemen. Properti utamanya adalah <code>border</code>, yang merupakan shorthand untuk <code>border-width</code>, <code>border-style</code>, dan <code>border-color</code>.</p>
                            <pre><code>.box-dengan-border {
  /* 2px ketebalan, gaya garis solid, warna hitam */
  border: 2px solid black;

  /* Anda juga bisa mengatur gaya lain seperti 'dotted' atau 'dashed' */
  border-style: dashed;
  border-color: navy;
  border-width: 3px;
}</code></pre>
                            <h5 class="font-semibold mt-6">Margin</h5>
                            <p>Menciptakan ruang di luar elemen, mendorong elemen lain menjauh.</p>
                            <pre><code>.box-dengan-margin {
  /* 20px margin di semua sisi */
  margin: 20px;
  
  /* Atau secara spesifik */
  margin-top: 10px;
  margin-right: 15px;
  margin-bottom: 10px;
  margin-left: 15px;
  
  width: 200px;
  height: 100px;
  background-color: coral;
}</code></pre>
                        `},
                        { id: 'it11-8-topic3', name: 'box-sizing', content: `
                            <h4>Misteri box-sizing - Bagaimana Ukuran Sebenarnya Dihitung?</h4>
                            <p>Ini adalah salah satu konsep paling penting dalam CSS layout. Properti <code>box-sizing</code> menentukan bagaimana <code>width</code> dan <code>height</code> sebuah elemen dihitung.</p>
                            <img src="https://i0.wp.com/webdevpuneet.com/wp-content/uploads/2021/05/box-sizing-css.png?fit=794%2C360&ssl=1" alt="content-box vs border-box" class="my-6">
                            <h5 class="font-semibold mt-6">box-sizing: content-box; (Default)</h5>
                            <p>Secara default, <code>width</code> dan <code>height</code> yang Anda atur hanya berlaku untuk area konten. Padding dan Border akan ditambahkan di atasnya, membuat ukuran total elemen menjadi lebih besar dari yang Anda tentukan. (Ukuran Total = <code>width</code> + <code>padding</code> + <code>border</code>). Ini seringkali membingungkan.</p>
                            <h5 class="font-semibold mt-6">box-sizing: border-box; (Cara yang Lebih Intuitif)</h5>
                            <p>Dengan <code>border-box</code>, <code>width</code> dan <code>height</code> yang Anda atur adalah ukuran total dari elemen tersebut, termasuk padding dan border. Padding dan border akan "mendorong ke dalam" konten, bukan memperluas kotak keluar. Ini membuat layout menjadi jauh lebih mudah diprediksi.</p>
                            <p class="mt-4">Banyak developer mengatur ini sebagai standar di awal file CSS mereka:</p>
                            <pre><code>* {
  box-sizing: border-box;
}</code></pre>
                        `},
                        { id: 'it11-8-topic4', name: 'DevTools', content: `
                            <h4>Menjadi Detektif Layout dengan Browser DevTools</h4>
                            <p>Setiap browser modern memiliki "Developer Tools" (DevTools) yang sangat kuat. Salah satu fiturnya yang paling berguna adalah kemampuan untuk menginspeksi Box Model dari elemen manapun secara visual.</p>
                            <img src="https://www.codingexercises.com/img/2019-09-14/the-box-model-preview-in-developer-tools.PNG" alt="Browser DevTools showing the box model" class="my-6">
                            <h5 class="font-semibold mt-6">Cara Menginspeksi:</h5>
                            <ol class="list-decimal list-inside mt-2 space-y-1">
                                <li>Klik kanan pada elemen mana pun di halaman web.</li>
                                <li>Pilih "Inspect" atau "Inspect Element".</li>
                                <li>Di panel DevTools yang muncul, cari tab "Computed" atau "Layout".</li>
                                <li>Anda akan melihat diagram interaktif dari Box Model untuk elemen yang Anda pilih, lengkap dengan nilai margin, border, dan padding-nya.</li>
                            </ol>
                            <p class="mt-4">Ini adalah alat wajib bagi setiap web developer untuk memecahkan masalah layout.</p>
                        `},
                        { id: 'it11-8-topic5', name: 'Aktivitas', content: `
                            <h4>Aktivitas Utama: Praktik Terbimbing</h4>
                            <p>Sekarang giliran Anda untuk merapikan halaman portofolio Anda menggunakan Box Model.</p>
                            <p class="mt-4"><strong>Tugas Anda (di file style.css):</strong></p>
                            <ol class="list-decimal list-inside mt-2 space-y-2">
                                <li><strong>Atur Standar Emas:</strong> Di bagian paling atas file CSS Anda, tambahkan aturan <code>* { box-sizing: border-box; }</code> untuk membuat layout lebih mudah dikelola.</li>
                                <li><strong>Beri Ruang untuk Bernapas:</strong> Pilih container utama halaman Anda (mungkin <code>&lt;body&gt;</code> atau sebuah <code>&lt;div&gt;</code> pembungkus). Beri <code>padding</code> (misalnya 20px) agar konten tidak menempel di tepi browser.</li>
                                <li><strong>Jarak Antar Bagian:</strong> Targetkan elemen <code>&lt;section&gt;</code> atau <code>&lt;h2&gt;</code> Anda. Beri mereka <code>margin-top</code> dan <code>margin-bottom</code> (misalnya 30px) untuk menciptakan pemisahan visual yang jelas antar bagian.</li>
                                <li><strong>Hiasan Gambar:</strong> Targetkan gambar profil Anda (<code>&lt;img&gt;</code>).
                                    <ul class="list-disc list-inside ml-4 mt-2 space-y-1">
                                        <li>Beri <code>padding</code> (misalnya 5px) di sekelilingnya.</li>
                                        <li>Beri <code>border</code> yang bagus (misalnya <code>3px solid #ccc</code>).</li>
                                        <li>Atur <code>background-color</code> untuk area padding (misalnya <code>white</code>) agar terlihat seperti bingkai foto sungguhan.</li>
                                    </ul>
                                </li>
                                <li><strong>Jelajahi dengan DevTools:</strong> Buka halaman Anda di browser, klik kanan pada salah satu elemen yang baru Anda beri gaya, dan pilih "Inspect". Lihat bagaimana perubahan Anda tercermin dalam diagram Box Model.</li>
                            </ol>
                        `},
                        { id: 'it11-8-topic6', name: 'Refleksi', content: `
                            <h4>Penutup & Refleksi</h4>
                            <p><strong>Bagikan Hasil Inspeksi Anda</strong></p>
                            <ol class="list-decimal list-inside mt-4 space-y-2">
                                <li>Gunakan DevTools untuk menginspeksi salah satu elemen yang paling menarik di halaman Anda (misalnya, gambar profil dengan bingkai barunya).</li>
                                <li>Ambil screenshot dari seluruh layar, pastikan diagram Box Model di DevTools terlihat jelas.</li>
                                <li>Bagikan screenshot tersebut di Google Classroom atau Padlet.</li>
                            </ol>
                            <p class="mt-4"><strong>Diskusi & T&J:</strong> Siapkan pertanyaan tentang masalah layout yang mungkin Anda temui, seperti "Mengapa elemen saya tidak berada di tengah?" atau "Bagaimana cara menghilangkan jarak putih di sekitar body?".</p>
                        `},
                        { id: 'closing', name: 'Closing', content: closingTabContent }
                    ]
                },
                'it11-9': {
                    title: 'IT-11 - Meeting 9',
                    subtitle: 'CSS Layouting: Flexbox',
                    tabs: [
                        { id: 'opening', name: 'Opening', content: openingTabContent },
                        { id: 'it11-9-warmup', name: 'Warm-Up', content: `
                            <h4>The Classic Layout Problem</h4>
                            <p>Imagine you are tasked with creating a layout like this using only the HTML and CSS properties we've learned so far (like margin and padding):</p>
                            <img src="https://i.sstatic.net/n1csD.png" alt="Three boxes in a row" class="my-6 bg-white p-4">
                            <p class="mt-4"><strong>Questions for the class:</strong></p>
                            <ul class="list-disc list-inside mt-2 space-y-2">
                                <li>"How would we make these three boxes line up neatly horizontally?"</li>
                                <li>"How could we ensure the space between them is exactly the same, even when the screen size changes?"</li>
                            </ul>
                            <p class="mt-4">You'll find that this is very difficult to do the old way. That's why developers created more powerful tools for layout. One of the most popular and powerful is <strong>Flexbox</strong>.</p>
                            <div class="mt-6 p-4 bg-green-50 border border-green-200 rounded-lg">
                                <p><strong>Interactive Game Recommendation:</strong><br>A very fun way to learn Flexbox is by playing a game. Try this in your free time: <a href="https://flexboxfroggy.com/" target="_blank">Flexbox Froggy</a>. It's the best way to train your Flexbox logic!</p>
                            </div>
                        `},
                        { id: 'it11-9-topic1', name: 'What is Flexbox?', content: `
                            <h4>What is Flexbox?</h4>
                            <p>Flexbox (or the Flexible Box Layout) is a CSS layout model designed to arrange elements in a single dimension, either as a row or a column.</p>
                            <p class="mt-4">Imagine you have several books. With Flexbox, you can easily:</p>
                            <ul class="list-disc list-inside mt-2 space-y-2">
                                <li>Line up the books in a single row.</li>
                                <li>Align all the books to the center.</li>
                                <li>Give equal spacing between each book.</li>
                                <li>Make them automatically adapt if the width of the bookshelf changes.</li>
                            </ul>
                            <p class="mt-4">To use Flexbox, you must understand two main components:</p>
                            <img src="https://www.programiz.com/sites/tutorial2program/files/css-flex-container-example.png" alt="Flex Container and Flex Items" class="my-6">
                            <ul class="list-disc list-inside mt-2 space-y-2">
                                <li><strong>Flex Container:</strong> This is the parent element that we give the property <code>display: flex;</code>.</li>
                                <li><strong>Flex Items:</strong> These are the child elements inside the flex container.</li>
                            </ul>
                            <pre><code>&lt;!-- Flex Container --&gt;
&lt;div class="container"&gt;
  &lt;!-- Flex Items --&gt;
  &lt;div class="item"&gt;1&lt;/div&gt;
  &lt;div class="item"&gt;2&lt;/div&gt;
  &lt;div class="item"&gt;3&lt;/div&gt;
&lt;/div&gt;</code></pre>
                        `},
                        { id: 'it11-9-topic2', name: 'Main & Cross Axis', content: `
                            <h4>Core Concept - Main Axis & Cross Axis</h4>
                            <p>Unlike regular layout, Flexbox works based on two axes whose directions can change.</p>
                            <img src="https://s3-ap-south-1.amazonaws.com/trt-blog-ghost/2020/03/65.png" alt="Flexbox Main and Cross Axis" class="my-6">
                            <ul class="list-disc list-inside mt-2 space-y-2">
                                <li><strong>Main Axis:</strong> This is the primary direction in which flex items are arranged. By default, its direction is horizontal (left to right).</li>
                                <li><strong>Cross Axis:</strong> This is the axis perpendicular to the main axis. By default, its direction is vertical (top to bottom).</li>
                            </ul>
                            <p class="mt-4">Understanding these two axes is crucial, as Flexbox properties work relative to them.</p>
                        `},
                        { id: 'it11-9-topic3', name: 'Container Properties', content: `
                            <h4>Key Properties on the Flex Container</h4>
                            <p>The following properties are applied to the parent element (the flex container).</p>
                            <h5 class="font-semibold mt-6">display: flex;</h5>
                            <p>This is the magic switch that activates Flexbox. Once you apply it to a container, all its direct children become flex items and automatically try to line up.</p>
                            <pre><code>.container {
  display: flex;
}</code></pre>
                            <h5 class="font-semibold mt-6">flex-direction</h5>
                            <p>This property determines the direction of the Main Axis.</p>
                            <ul class="list-disc list-inside mt-2">
                                <li><code>row</code> (default): Items line up from left to right.</li>
                                <li><code>row-reverse</code>: Items line up from right to left.</li>
                                <li><code>column</code>: Items line up from top to bottom.</li>
                                <li><code>column-reverse</code>: Items line up from bottom to top.</li>
                            </ul>
                            <h5 class="font-semibold mt-6">justify-content</h5>
                            <p>This property arranges how flex items are distributed along the <strong>Main Axis</strong>.</p>
                            <img src="https://media2.dev.to/dynamic/image/width=800%2Cheight=%2Cfit=scale-down%2Cgravity=auto%2Cformat=auto/https%3A%2F%2Fdev-to-uploads.s3.amazonaws.com%2Fuploads%2Farticles%2Fs7yhmbfp59ml4q3trh09.jpg" alt="justify-content options" class="my-6">
                            <h5 class="font-semibold mt-6">align-items</h5>
                            <p>This property arranges how flex items are aligned along the <strong>Cross Axis</strong>.</p>
                            <img src="https://images.thoughtbot.com/cp-design-for-the-web/SOtxyVsFR5uFGQAps9wW_layout-align-content.png" alt="align-items options" class="my-6">
                        `},
                        { id: 'it11-9-topic4', name: 'Main Activity', content: `
                            <h4>Main Activity: Hands-on Practice</h4>
                            <p>It's time to apply the power of Flexbox to your portfolio page! You will create two common components: a navigation bar and a card gallery.</p>
                            <h5 class="font-semibold mt-6">Task 1: Create a Horizontal Navigation Bar</h5>
                            <p>In your <code>index.html</code>, structure your navigation inside the <code>&lt;header&gt;</code> like this:</p>
                            <pre><code>&lt;nav&gt;
  &lt;a href="#home"&gt;Home&lt;/a&gt;
  &lt;a href="#about"&gt;About&lt;/a&gt;
  &lt;a href="#portfolio"&gt;Portfolio&lt;/a&gt;
  &lt;a href="#contact"&gt;Contact&lt;/a&gt;
&lt;/nav&gt;</code></pre>
                            <p class="mt-4">In your <code>style.css</code> file, target the <code>&lt;nav&gt;</code> element:</p>
                            <pre><code>nav {
  display: flex;
  justify-content: center; /* or flex-end, or space-around */
  background-color: #333;
  padding: 15px;
}
nav a {
  color: white;
  text-decoration: none;
  margin: 0 15px; /* Adds space between links */
}</code></pre>
                            <h5 class="font-semibold mt-6">Task 2: Create a Section with Aligned Cards</h5>
                            <p>In <code>index.html</code>, create a new <code>&lt;section&gt;</code> for your portfolio:</p>
                            <pre><code>&lt;section class="portfolio"&gt;
  &lt;div class="card"&gt;Project 1&lt;/div&gt;
  &lt;div class="card"&gt;Project 2&lt;/div&gt;
  &lt;div class="card"&gt;Project 3&lt;/div&gt;
&lt;/section&gt;</code></pre>
                            <p class="mt-4">In <code>style.css</code>, target the <code>.portfolio</code> and <code>.card</code> classes:</p>
                            <pre><code>.portfolio {
  display: flex;
  justify-content: space-around; /* To have space around the cards */
}

.card {
  width: 200px;
  height: 150px;
  background-color: lightgray;
  border: 1px solid #ccc;
  padding: 10px;
  text-align: center;
}</code></pre>
                            <p class="mt-4">Experiment by changing the <code>justify-content</code> value on <code>.portfolio</code> to see the different effects!</p>
                        `},
                        { id: 'it11-9-topic5', name: 'Reflection', content: `
                            <h4>Push & Reflect</h4>
                            <p>Save all your changes in VS Code. Use the terminal to commit and push your new layout to your GitHub repository.</p>
                            <pre><code>git add .
git commit -m "feat: Add Flexbox layout for navigation and portfolio"
git push</code></pre>
                            <h5 class="font-semibold mt-6">Answer in README.md</h5>
                            <p>Open the <code>README.md</code> file in your repository and add a new section to answer this question:</p>
                            <blockquote class="mt-2 border-l-4 pl-4 italic">"In which part of your page did Flexbox prove most useful? Why?"</blockquote>
                        `},
                        { id: 'closing', name: 'Closing', content: closingTabContent }
                    ]
                },
                'it11-10': {
                    title: 'IT-11 - Meeting 10',
                    subtitle: 'Mastering Flexbox Layout',
                    tabs: [
                        { id: 'opening', name: 'Opening', content: openingTabContent },
                        { id: 'it11-10-warmup', name: 'Warm-Up', content: `
                            <h4>Review: The Flexbox Foundation</h4>
                            <p>In our last session, we learned the magic command that starts it all: <code>display: flex;</code>. We turned a parent element (the <strong>Flex Container</strong>) into a flexible layout manager for its children (the <strong>Flex Items</strong>).</p>
                            <p class="mt-4">We also learned about <code>flex-direction</code>, which sets the main axis (either <code>row</code> or <code>column</code>).</p>
                            <p class="mt-4"><strong>Quick Question:</strong> "If you have three divs inside a container and you apply <code>display: flex;</code> to the container, what happens to the divs by default?"</p>
                            <p class="mt-2 text-gray-600">(Answer: They will line up horizontally in a row.)</p>
                            <p class="mt-4">Today, we're going to master how to align and distribute those items with precision using more container properties, and then we'll learn how to control the items themselves!</p>
                        `},
                        { id: 'it11-10-flex-direction', name: 'flex-direction', content: `
                            <h4>flex-direction: Setting the Main Axis</h4>
                            <p>This property establishes the <strong>main-axis</strong>, which defines the direction flex items are placed in the flex container. Think of flex items as primarily laying out either in horizontal rows or vertical columns.</p>
                            <img src="https://css-tricks.com/wp-content/uploads/2018/10/flex-direction.svg" alt="The four possible values of flex-direction" class="my-6 bg-white p-4 rounded-lg shadow-md">
                            <ul class="list-disc list-inside mt-4 space-y-3">
                                <li><code><strong>row</strong></code> (default): Items are placed from left to right.</li>
                                <li><code><strong>row-reverse</strong></code>: Items are placed from right to left.</li>
                                <li><code><strong>column</strong></code>: Items are placed from top to bottom.</li>
                                <li><code><strong>column-reverse</strong></code>: Items are placed from bottom to top.</li>
                            </ul>
                            <h5 class="font-semibold mt-6">Code Example:</h5>
                            <p>See what happens when you change the <code>flex-direction</code> from <code>row</code> to <code>column</code>.</p>
                            <pre><code class="language-html">&lt;!-- HTML Structure --&gt;
&lt;div class="flex-container direction-example"&gt;
  &lt;div class="item"&gt;1&lt;/div&gt;
  &lt;div class="item"&gt;2&lt;/div&gt;
  &lt;div class="item"&gt;3&lt;/div&gt;
&lt;/div&gt;

&lt;!-- CSS Styling --&gt;
&lt;style&gt;
  .direction-example {
    display: flex;
    background-color: #e9ecef;
    border: 1px solid #dee2e6;
    
    /* --- TRY CHANGING THIS VALUE! --- */
    /* Options: row, row-reverse, column, column-reverse */
    flex-direction: row;
  }
  .direction-example .item {
    background-color: #F7B32B;
    padding: 1rem;
    margin: 0.5rem;
    color: #333745;
    font-weight: bold;
  }
&lt;/style&gt;</code></pre>
                        `},
                        { id: 'it11-10-flex-wrap', name: 'flex-wrap', content: `
                            <h4>flex-wrap: To Wrap or Not to Wrap</h4>
                            <p>By default, flex items will all try to shrink and fit onto one line, even if it makes them look squished. The <code>flex-wrap</code> property allows you to change that and let the items wrap onto multiple lines as needed.</p>
                            <img src="https://css-tricks.com/wp-content/uploads/2018/10/flex-wrap.svg" alt="Diagram showing flex items wrapping to a new line" class="my-6 bg-white p-4 rounded-lg shadow-md">
                            <ul class="list-disc list-inside mt-4 space-y-3">
                                <li><code><strong>nowrap</strong></code> (default): All flex items will be on one line.</li>
                                <li><code><strong>wrap</strong></code>: Flex items will wrap onto multiple lines, from top to bottom.</li>
                                <li><code><strong>wrap-reverse</strong></code>: Flex items will wrap onto multiple lines from bottom to top.</li>
                            </ul>
                            <h5 class="font-semibold mt-6">Code Example:</h5>
                            <p>Here we have many items in a container. See the difference between <code>nowrap</code> (squished) and <code>wrap</code> (organized).</p>
                            <pre><code class="language-html">&lt;!-- HTML Structure --&gt;
&lt;div class="flex-container wrap-example"&gt;
  &lt;div class="item"&gt;1&lt;/div&gt; &lt;div class="item"&gt;2&lt;/div&gt; &lt;div class="item"&gt;3&lt;/div&gt;
  &lt;div class="item"&gt;4&lt;/div&gt; &lt;div class="item"&gt;5&lt;/div&gt; &lt;div class="item"&gt;6&lt;/div&gt;
  &lt;div class="item"&gt;7&lt;/div&gt; &lt;div class="item"&gt;8&lt;/div&gt;
&lt;/div&gt;

&lt;!-- CSS Styling --&gt;
&lt;style&gt;
  .wrap-example {
    display: flex;
    border: 1px solid #dee2e6;
    
    /* --- TRY CHANGING THIS VALUE! --- */
    /* Options: nowrap, wrap */
    flex-wrap: wrap;
  }
  .wrap-example .item {
    background-color: #2596BE; /* Primary Blue */
    color: white;
    padding: 1rem;
    margin: 0.5rem;
    width: 150px; /* Give items a fixed width */
  }
&lt;/style&gt;</code></pre>
                        `},
                        { id: 'it11-10-topic1', name: 'justify-content', content: `
                            <h4>justify-content: Spacing Out Your Toys</h4>
                            <p>Imagine you have a big toy box (your flex container) and a few action figures (your flex items). The <code>justify-content</code> property is like telling your action figures how to line up inside the box from left to right.</p>
                            <p class="mt-4">This property is all about controlling the alignment and spacing of items along the <strong>main axis</strong> (the horizontal line, by default). It's what you use when you have extra empty space in your container and you want to decide what to do with it.</p>
                            <img src="https://css-tricks.com/wp-content/uploads/2018/10/justify-content.svg" alt="Visual examples of justify-content values" class="my-6 bg-white p-4 rounded-lg shadow-md">
                            <ul class="list-disc list-inside mt-4 space-y-3">
                                <li><code><strong>flex-start</strong></code> (default): All your action figures are huddled together at the <strong>start</strong> (left side) of the toy box.</li>
                                <li><code><strong>flex-end</strong></code>: All your action figures are huddled together at the <strong>end</strong> (right side) of the toy box.</li>
                                <li><code><strong>center</strong></code>: All your action figures are grouped together right in the <strong>center</strong> of the toy box.</li>
                                <li><code><strong>space-between</strong></code>: This is a popular one! The first action figure touches the left side, the last one touches the right side, and all the extra space is shared evenly <strong>between</strong> them. There's no space at the ends.</li>
                                <li><code><strong>space-around</strong></code>: Each action figure gets an equal amount of personal space <strong>around</strong> it. This means the space at the very ends of the box is half the size of the space between the figures (because the end figures only have space on one side, while the middle ones have space on both sides).</li>
                                <li><code><strong>space-evenly</strong></code>: This is the fairest of all! The space between every action figure, and the space from the figures to the edges of the box, is exactly the same. All gaps are <strong>even</strong>.</li>
                            </ul>
                            <h5 class="font-semibold mt-6">Code Example:</h5>
                            <p>Try changing the value of <code>justify-content</code> in this example to see how the boxes move!</p>
                            <pre><code class="language-html">&lt;!-- HTML Structure --&gt;
&lt;div class="flex-container justify-example"&gt;
  &lt;div class="item"&gt;1&lt;/div&gt;
  &lt;div class="item"&gt;2&lt;/div&gt;
  &lt;div class="item"&gt;3&lt;/div&gt;
&lt;/div&gt;

&lt;!-- CSS Styling --&gt;
&lt;style&gt;
  .justify-example {
    display: flex;
    background-color: #e9ecef;
    border: 1px solid #dee2e6;
    
    /* --- TRY CHANGING THIS VALUE! --- */
    /* Options: flex-start, center, space-between, space-around, space-evenly */
    justify-content: space-between;
  }
  .justify-example .item {
    width: 60px;
    height: 60px;
    background-color: #F7B32B;
    color: #333745;
    font-weight: bold;
    display: flex;
    align-items: center;
    justify-content: center;
  }
&lt;/style&gt;</code></pre>
                        `},
                        { id: 'it11-10-topic2', name: 'align-items', content: `
                            <h4>Aligning on the Cross Axis: <code>align-items</code></h4>
                            <p>While <code>justify-content</code> works on the main axis, <code>align-items</code> defines how flex items are aligned along the <strong>cross axis</strong>.</p>
                            <p class="mt-2">If our main axis is a row (horizontal), then the cross axis is vertical.</p>
                            <img src="https://css-tricks.com/wp-content/uploads/2018/10/align-items.svg" alt="Visual examples of align-items values" class="my-6 bg-white p-4 rounded-lg shadow-md">
                            <ul class="list-disc list-inside mt-4 space-y-3">
                                <li><code><strong>stretch</strong></code> (default): Items stretch to fill the container's height (or width if <code>flex-direction</code> is column).</li>
                                <li><code><strong>flex-start</strong></code>: Items are aligned to the start of the cross axis (top).</li>
                                <li><code><strong>flex-end</strong></code>: Items are aligned to the end of the cross axis (bottom).</li>
                                <li><code><strong>center</strong></code>: Items are centered on the cross axis (vertically centered).</li>
                            </ul>
                            <h5 class="font-semibold mt-6">Code Example:</h5>
                            <p>Let's see it in action. A container must have a defined height for <code>align-items</code> to have a visible effect (unless using <code>stretch</code> on items without a set height).</p>
                            <pre><code class="language-html">&lt;!-- HTML Structure --&gt;
&lt;div class="flex-container align-example"&gt;
  &lt;div class="item"&gt;1&lt;/div&gt;
  &lt;div class="item tall"&gt;2&lt;/div&gt;
  &lt;div class="item"&gt;3&lt;/div&gt;
&lt;/div&gt;

&lt;!-- CSS Styling --&gt;
&lt;style&gt;
  .align-example {
    display: flex;
    height: 200px; /* Height is needed to see vertical alignment */
    background-color: #e9ecef;
    border: 1px solid #dee2e6;
    
    /* --- TRY CHANGING THIS VALUE! --- */
    /* Options: flex-start, flex-end, center, stretch */
    align-items: center;
  }
  .align-example .item {
    background-color: #F7B32B;
    padding: 1rem;
    margin: 0.5rem;
    color: #333745;
    font-weight: bold;
  }
&lt;/style&gt;</code></pre>
                        `},
                        { id: 'it11-10-flex-grow', name: 'flex-grow', content: `
                            <h4>flex-grow: The "Greedy" Property</h4>
                            <p>So far, we've only applied properties to the container. But we can also give special instructions to individual flex items! The <code>flex-grow</code> property is the first of these.</p>
                            <p class="mt-4">This property defines an item's ability to "grow" and take up any available free space inside the flex container. Think of it as a "greediness" level.</p>
                            <img src="https://css-tricks.com/wp-content/uploads/2018/10/flex-grow.svg" alt="Diagram showing how flex-grow distributes space" class="my-6 bg-white p-4 rounded-lg shadow-md">
                            <h5 class="font-semibold mt-6">How it Works:</h5>
                            <p>The <code>flex-grow</code> property accepts a single, unitless number that acts as a proportion. The default value is <code>0</code>, which means items will not grow at all.</p>
                            <ul class="list-disc list-inside mt-4 space-y-3">
                                <li>If all items have <code>flex-grow: 1;</code>, the leftover space in the container will be distributed equally among all of them.</li>
                                <li>If one item has <code>flex-grow: 2;</code> and the others have <code>flex-grow: 1;</code>, the "greedy" item will try to take up twice as much of the available space as the others.</li>
                            </ul>
                            <p class="mt-4"><strong>Analogy: Sharing a Pizza 🍕</strong><br>Imagine three friends and one leftover pizza slice (the "available space").</p>
                            <ul class="list-disc list-inside mt-2 space-y-2">
                                <li>If everyone has <code>flex-grow: 1</code>, they split the slice into three equal parts.</li>
                                <li>If one friend has <code>flex-grow: 2</code> and the others have <code>flex-grow: 1</code>, they'd split the slice into four parts, and the greedy friend would get two of those parts!</li>
                            </ul>
                            <pre><code>.item {
  flex-grow: 1; /* This item will grow to take up a share of the free space. */
}

.greedy-item {
  flex-grow: 4; /* This item wants 4 times the share of the free space. */
}</code></pre>
                            <p class="mt-4"><em>Note: Negative numbers are not valid for <code>flex-grow</code>.</em></p>
                        `},
                        { id: 'it11-10-order', name: 'order', content: `
                            <h4>order: Changing the Line-up</h4>
                            <p>Normally, flex items appear in the same order as they are written in the HTML file. The <code>order</code> property is a superpower that lets you change their visual order without touching the HTML!</p>
                            <img src="https://css-tricks.com/wp-content/uploads/2018/10/order.svg" alt="Diagram showing how the order property re-arranges flex items" class="my-6 bg-white p-4 rounded-lg shadow-md">
                            <h5 class="font-semibold mt-6">How it Works:</h5>
                            <p>By default, every flex item has an <code>order</code> value of <code>0</code>. The browser then arranges them from the lowest order number to the highest.</p>
                             <ul class="list-disc list-inside mt-4 space-y-3">
                                <li>An item with <code>order: -1;</code> will appear before any items with the default <code>order: 0;</code>.</li>
                                <li>An item with <code>order: 1;</code> will appear after any items with <code>order: 0;</code>.</li>
                                <li>If multiple items have the same <code>order</code> value, they will be arranged among themselves based on their original source order in the HTML.</li>
                            </ul>
                            <pre><code>.item-1 { order: 2; } /* This will appear third (or last) */
.item-2 { order: -1; } /* This will appear first */
.item-3 { order: 1; } /* This will appear second */</code></pre>
                            <p class="mt-4">This property is extremely useful for responsive design, where you might want to show elements in a different order on a mobile screen compared to a desktop screen.</p>
                        `},
                        { id: 'it11-10-activity', name: 'Mini Project: Navbar', content: `
                            <h4>Mini Project: Build a Responsive Navbar</h4>
                            <p>Let's use everything we've learned to build a common and essential website component: a navigation bar.</p>
                            <h5 class="font-semibold mt-6">Step 1: The HTML Structure</h5>
                            <p>In your <code>index.html</code>, add this structure inside your <code>&lt;header&gt;</code> tag.</p>
                            <pre><code>&lt;header&gt;
    &lt;nav class="navbar"&gt;
        &lt;div class="logo"&gt;MySite&lt;/div&gt;
        &lt;div class="nav-links"&gt;
            &lt;a href="#"&gt;Home&lt;/a&gt;
            &lt;a href="#"&gt;About&lt;/a&gt;
            &lt;a href="#"&gt;Services&lt;/a&gt;
        &lt;/div&gt;
        &lt;div class="contact-button"&gt;
            &lt;a href="#"&gt;Contact Us&lt;/a&gt;
        &lt;/div&gt;
    &lt;/nav&gt;
&lt;/header&gt;</code></pre>
                            <h5 class="font-semibold mt-6">Step 2: The CSS Styling</h5>
                            <p>In your <code>style.css</code>, let's bring it to life with Flexbox.</p>
                            <pre><code>/* 1. Turn the navbar into a flex container */
.navbar {
    display: flex;
    justify-content: space-between; /* This is key! Pushes logo/links and button apart */
    align-items: center; /* Vertically centers all items */
    background-color: #2c3e50;
    padding: 1rem 2rem;
    color: white;
}

/* 2. Style the logo */
.logo {
    font-size: 1.5rem;
    font-weight: bold;
}

/* 3. Style the navigation links */
.nav-links a {
    color: white;
    text-decoration: none;
    margin: 0 1rem; /* Adds space between the links */
    font-size: 1rem;
}

/* 4. Style the contact button */
.contact-button a {
    background-color: #F7B32B; /* Your primary yellow */
    color: #333745;
    padding: 0.5rem 1rem;
    border-radius: 5px;
    text-decoration: none;
    font-weight: bold;
}</code></pre>
                            <h5 class="font-semibold mt-6">Code Exercise: Using <code>flex-grow</code></h5>
                            <p>What if we wanted the navigation links to take up all the available middle space? Modify the <code>.nav-links</code> class to use <code>flex-grow</code> and center the text inside it.</p>
                            <button class="internal-accordion-btn mt-4 text-sm font-semibold text-blue-600">Show Solution ▼</button>
                            <div class="internal-accordion-content hidden mt-4 pt-4 border-t">
                                <pre><code>.nav-links {
    flex-grow: 1; /* Allows this div to grow and fill empty space */
    text-align: center; /* Centers the links within the grown div */
}</code></pre>
                            </div>
                        `},
                        { id: 'it11-10-reflection', name: 'Reflection', content: `
                            <h4>Push & Reflect</h4>
                            <p>Save all your changes in VS Code. Use the terminal to commit and push your new, flexible navbar to your GitHub repository.</p>
                            <pre><code>git add .
git commit -m "feat: Build a responsive navbar with Flexbox"
git push</code></pre>
                            <h5 class="font-semibold mt-6">Answer in README.md</h5>
                            <p>Open the <code>README.md</code> file in your repository and add a new section to answer this question:</p>
                            <blockquote class="mt-2 border-l-4 pl-4 italic">"Explain in your own words what <code>justify-content: space-between;</code> does and why it was so useful for creating the navbar layout."</blockquote>
                        `},

                    ]

                'it10-6': {
                    title: 'IT-10 - Meeting 6',
                    subtitle: 'How The Web Works - From Your Keyboard to the Globe',
                    tabs: [
                        { id: 'opening', name: 'Opening', content: openingTabContent },
                        { id: 'it10-6-warmup', name: 'Warm-Up', content: `
                            <h4>Opening Mission</h4>
                            <h5 class="font-semibold mt-6">Warm-Up Question:</h5>
                            <p>Let's start with a big question. You do it every day, but have you ever thought about it? <strong>"What do you <em>actually</em> think happens, step-by-step, when you type <code>google.com</code> into your browser and hit Enter?"</strong></p>
                            <p class="mt-2">Let's brainstorm some ideas. There are no wrong answers!</p>
                            <h5 class="font-semibold mt-6">Live Demo: Peeking Under the Hood</h5>
                            <p>Watch as I open a website and open up a secret tool called <strong>Developer Tools</strong> (or "Inspect Element"). This tool is built into every modern browser and lets us see the raw code that builds the pages we use every day. What do you notice? What looks familiar or strange? This is the code that makes the web work, and today we're going to understand what it is and how it gets to your screen.</p>
                        `},
                        { id: 'it10-6-topic1', name: 'The Journey', content: `
                            <h4>The Journey of a Website - How the Internet Works</h4>
                            <p>When you request a website, you're kicking off an amazing, near-instantaneous global journey. Think of it like ordering a pizza:</p>
                            <ol class="list-decimal list-inside mt-4 space-y-3">
                                <li><strong>You Decide What You Want (The URL):</strong> You tell your browser (<code>Chrome</code>, <code>Firefox</code>, etc.) you want to go to <code>www.google.com</code>. This is like deciding you want a pepperoni pizza.</li>
                                <li><strong>Look Up the Address (DNS):</strong> Your computer doesn't know where <code>google.com</code> lives. It needs a specific address, called an <strong>IP Address</strong> (e.g., <code>142.250.191.78</code>). Your computer asks a special internet phonebook called the <strong>DNS (Domain Name System)</strong>. The DNS looks up "google.com" and tells your computer its IP address. This is like looking up the pizza place's street address.</li>
                                <li><strong>Place the Order (HTTP Request):</strong> Your browser now sends a message, called an <strong>HTTP Request</strong>, across the internet to the computer (called a <strong>server</strong>) at that IP address. The message says, "Please send me the files for the google.com homepage." This is you calling the pizza place and ordering your pizza.</li>
                                <li><strong>The Kitchen Prepares the Order (The Server):</strong> The Google <strong>server</strong> is a powerful computer whose job is to listen for these requests. When it gets your request, it gathers all the necessary files—the HTML, CSS, and JavaScript—to build the homepage. This is the pizza kitchen making your pizza.</li>
                                <li><strong>Deliver the Pizza (HTTP Response):</strong> The server sends all those files back across the internet to your browser. This is called an <strong>HTTP Response</strong>. This is the delivery driver bringing the pizza to your house.</li>
                                <li><strong>Enjoy Your Meal (Rendering the Page):</strong> Your browser receives the files and reads them, assembling them into the visual website you can see and interact with. This is you opening the box and seeing the delicious pizza!</li>
                            </ol>
                            <p class="mt-4">This entire process happens through a global network of cables, satellites, and routers. Every time you click a link, you're sending a new request on this incredible journey.</p>
                        `},
                        { id: 'it10-6-topic2', name: 'Frontend vs. Backend', content: `
                            <h4>The Two Sides of a Website - Frontend vs. Backend</h4>
                            <p>Every complex website or web application has two "sides," just like a restaurant has a dining room and a kitchen. This is called the <strong>Client-Server Model</strong>.</p>
                            <ul class="list-disc list-inside mt-4 space-y-3">
                                <li><strong>The Client (Frontend):</strong> This is everything you, the user, can see and interact with in your browser. It's the "dining room" of the restaurant—the tables, the menus, the decor. The code for the frontend is sent to your browser and runs on <em>your</em> computer.</li>
                                <li><strong>The Server (Backend):</strong> This is the hidden part of the website that you don't see. It's the "kitchen"—where the data is stored (in <strong>databases</strong>), where user accounts are managed, and where all the complex logic happens. The backend code runs on the company's powerful computers (servers).</li>
                            </ul>
                            <p class="mt-4">When you log into Instagram, the login form you see is the <strong>Frontend</strong>. When you hit "Login," your details are sent to the <strong>Backend</strong>, which checks if your password is correct and then sends back your profile data to be displayed by the frontend.</p>
                        `},
                        { id: 'it10-6-topic3', name: 'The Building Blocks', content: `
                            <h4>The Building Blocks of the Web - HTML, CSS, & JavaScript</h4>
                            <p>The frontend of every website is built with three essential languages. The best way to understand their roles is with an analogy: building a house.</p>
                            <img src="https://miro.medium.com/v2/resize:fit:800/1*4u3N6gec_QEVA_Yu2Tfi0w.jpeg" alt="HTML, CSS, JS as a house analogy" class="my-6">
                            <h5 class="font-semibold mt-6">HTML (HyperText Markup Language): The Structure</h5>
                            <p>HTML is the standard language for creating the <strong>content and structure</strong> of a webpage. It's the skeleton or the blueprint of the house. It uses "tags" like <code>&lt;h1&gt;</code>, <code>&lt;p&gt;</code>, and <code>&lt;img&gt;</code> to define what each piece of content <em>is</em>.</p>
                            <pre><code>&lt;h1&gt;Welcome to My House&lt;/h1&gt;
&lt;p&gt;This is the living room.&lt;/p&gt;</code></pre>
                            <h5 class="font-semibold mt-6">CSS (Cascading Style Sheets): The Style</h5>
                            <p>CSS is the language used to describe the <strong>presentation and visual design</strong> of a webpage. It's the interior and exterior decoration of the house. It targets the HTML elements and tells them how to look.</p>
                            <pre><code>h1 {
  color: blue;
  font-size: 40px;
}
p {
  color: grey;
}</code></pre>
                            <h5 class="font-semibold mt-6">JavaScript (JS): The Behavior</h5>
                            <p>JavaScript is a programming language that brings <strong>interactivity and dynamic behavior</strong> to a website. It's the electricity, plumbing, and appliances that make the house functional. It handles things that happen <em>after</em> the page has loaded.</p>
                            <pre><code>let button = document.querySelector('button');
button.addEventListener('click', () =&gt; {
  alert('You rang the doorbell!');
});</code></pre>
                        `},
                        { id: 'it10-6-topic4', name: 'IDEs', content: `
                            <h4>The Developer's Workshop - Integrated Development Environments (IDEs)</h4>
                            <h5 class="font-semibold mt-6">What is an IDE?</h5>
                            <p>An <strong>IDE (Integrated Development Environment)</strong> is a software application that provides programmers with a complete set of tools for software development. Think of it as a super-powered text editor designed specifically for writing code.</p>
                            <h5 class="font-semibold mt-6">What Does an IDE Do?</h5>
                            <p>An IDE combines several tools into one program:</p>
                            <ul class="list-disc list-inside mt-2 space-y-2">
                                <li><strong>Code Editor:</strong> A smart text editor with features like syntax highlighting and autocomplete.</li>
                                <li><strong>Debugger:</strong> A tool that helps you find and fix bugs (errors) in your code.</li>
                                <li><strong>Build Automation:</strong> Tools that help compile and prepare your code to be run.</li>
                                <li><strong>Terminal/Console:</strong> A built-in command line so you can run commands without leaving the application.</li>
                            </ul>
                        `},
                        { id: 'it10-6-topic5', name: 'VS Code', content: `
                            <h4>Your First Workshop: Visual Studio Code (VS Code)</h4>
                            <h5 class="font-semibold mt-6">Why VS Code?</h5>
                            <p>There are many IDEs, but <strong>VS Code</strong> is currently the most popular choice for web development, and for good reason:</p>
                            <ul class="list-disc list-inside mt-2 space-y-2">
                                <li><strong>Free:</strong> It's completely free, with no hidden costs.</li>
                                <li><strong>Fast & Lightweight:</strong> It doesn't slow down your computer like some larger IDEs.</li>
                                <li><strong>Huge Extension Library:</strong> There's an extension for almost anything you can imagine.</li>
                                <li><strong>Integrated Terminal:</strong> You can run Git commands and other tools right inside the editor.</li>
                            </ul>
                            <h5 class="font-semibold mt-6">How to Install VS Code</h5>
                            <ol class="list-decimal list-inside mt-2 space-y-2">
                                <li><strong>Go to the Official Website:</strong> Open your browser and navigate to <a href="https://code.visualstudio.com/" target="_blank">https://code.visualstudio.com/</a>.</li>
                                <li><strong>Download:</strong> The website will automatically detect your OS. Click the download button.</li>
                                <li><strong>Run the Installer:</strong>
                                    <ul class="list-disc list-inside ml-4 mt-1">
                                        <li><strong>On Windows:</strong> Find the downloaded <code>.exe</code> file and double-click it. Follow the setup wizard.</li>
                                        <li><strong>On Mac:</strong> Find the downloaded <code>.zip</code> file. Unzip it, and drag the <code>Visual Studio Code.app</code> into your <code>Applications</code> folder.</li>
                                    </ul>
                                </li>
                            </ol>
                            <p class="mt-2">That's it! You now have a professional-grade code editor on your computer.</p>
                        `},
                        { id: 'it10-6-topic6', name: 'Putting It Together', content: `
                            <h4>Connecting All the Pieces</h4>
                            <p>So, how does everything we've talked about fit together?</p>
                            <blockquote class="mt-4 border-l-4 border-blue-500 pl-4 italic">
                                <p>You, the developer, use an <strong>IDE</strong> like <strong>VS Code</strong> to write your <strong>HTML</strong> (structure), <strong>CSS</strong> (style), and <strong>JavaScript</strong> (behavior) code. These three languages combine to create the <strong>frontend</strong> of your website.</p>
                                <p class="mt-2">When you're done, you upload these files to a <strong>server</strong>.</p>
                                <p class="mt-2">When a user wants to see your site, they use the <strong>Internet</strong> to send a request from their browser (the client) to your server. The server sends your HTML, CSS, and JS files back to them, and their browser assembles it all into the final, beautiful, interactive website you built.</p>
                            </blockquote>
                        `},
                        { id: 'it10-6-topic7', name: 'Activity', content: `

                'it10-7': {
                    title: 'IT-10 - Meeting 7',
                    subtitle: 'Review HTML & Struktur Dasar Halaman',
                    tabs: [
                        { id: 'opening', name: 'Opening', content: openingTabContent },
                        { id: 'it10-7-warmup', name: 'Pemanasan', content: `
                            <h4>Elemen Wajib Sebuah Website</h4>
                            <p>Mari kita mulai dengan melihat halaman web yang sangat sederhana.</p>
                            <p class="mt-4"><strong>Pertanyaan untuk kelas:</strong> "Melihat halaman ini, menurut kalian, elemen atau tag apa saja yang benar-benar wajib ada di setiap halaman web agar bisa berfungsi? Tanpa elemen ini, browser tidak akan bisa membacanya. Apa saja itu?"</p>
                            <p class="mt-4">Diskusi ini bertujuan untuk memancing ingatan siswa tentang kerangka kerja paling fundamental dari sebuah dokumen HTML sebelum kita mengulasnya secara mendalam.</p>
                        `},
                        { id: 'it10-7-topic1', name: 'Kerangka Wajib', content: `
                            <h4>Kerangka Kerja Wajib - &lt;!DOCTYPE&gt;, &lt;html&gt;, &lt;head&gt;, dan &lt;body&gt;</h4>
                            <p>Setiap halaman web, tidak peduli seberapa rumitnya, dibangun di atas empat pilar utama. Anggap saja ini seperti cetak biru sebuah bangunan.</p>
                            <pre><code>&lt;!DOCTYPE html&gt;
&lt;html&gt;
&lt;head&gt;
    &lt;title&gt;Judul Halaman&lt;/title&gt;
&lt;/head&gt;
&lt;body&gt;
    &lt;!-- Konten yang terlihat oleh pengunjung akan ada di sini --&gt;
&lt;/body&gt;
&lt;/html&gt;</code></pre>
                            <ul class="list-disc list-inside mt-4 space-y-2">
                                <li><strong>&lt;!DOCTYPE html&gt;:</strong> Ini adalah deklarasi, bukan tag. Ini adalah baris paling pertama yang memberitahu browser bahwa dokumen ini adalah halaman HTML5. Wajib ada!</li>
                                <li><strong>&lt;html&gt;:</strong> Ini adalah "akar" atau pembungkus utama dari seluruh halaman. Semua elemen lain harus berada di dalamnya.</li>
                                <li><strong>&lt;head&gt;:</strong> Bagian "kepala" dari dokumen. Informasi di dalam tag ini tidak terlihat langsung di halaman utama browser. Isinya adalah "data tentang data" (metadata) seperti <code>&lt;title&gt;</code>.</li>
                                <li><strong>&lt;body&gt;:</strong> Bagian "badan" dari dokumen. Semua konten yang ingin Anda tampilkan kepada pengunjung—teks, gambar, video, link—harus diletakkan di dalam tag ini.</li>
                            </ul>
                        `},
                        { id: 'it10-7-topic2', name: 'Tag &lt;title&gt;', content: `
                            <h4>Judul Halaman - Tag &lt;title&gt;</h4>
                            <p><strong>Fungsi:</strong> Menentukan teks yang muncul di tab browser. Ini sangat penting untuk identitas halaman dan SEO (Search Engine Optimization).</p>
                            <p class="mt-2"><strong>Tempat:</strong> Selalu di dalam tag <code>&lt;head&gt;</code>.</p>
                            <p class="mt-4"><strong>Mari Kita Coba:</strong></p>
                            <p>Buat file <code>latihan.html</code> dan tambahkan kode ini. Lihat apa yang muncul di tab browser Anda!</p>
                            <pre><code>&lt;!DOCTYPE html&gt;
&lt;html&gt;
&lt;head&gt;
    &lt;title&gt;Halaman Latihan Saya&lt;/title&gt;
&lt;/head&gt;
&lt;body&gt;
    &lt;p&gt;Lihat ke atas, ke tab browser!&lt;/p&gt;
&lt;/body&gt;
&lt;/html&gt;</code></pre>
                        `},
                        { id: 'it10-7-topic3', name: 'Headings', content: `
                            <h4>Hirarki Konten - Tag Heading &lt;h1&gt; sampai &lt;h6&gt;</h4>
                            <p><strong>Fungsi:</strong> Membuat judul dan subjudul untuk memberikan struktur pada konten. Ini sangat penting untuk pembaca dan mesin pencari.</p>
                            <p class="mt-2"><strong>Aturan:</strong> <code>&lt;h1&gt;</code> adalah judul paling penting (hanya boleh ada satu per halaman), <code>&lt;h2&gt;</code> adalah subjudulnya, dan seterusnya hingga <code>&lt;h6&gt;</code>.</p>
                            <p class="mt-4"><strong>Mari Kita Coba:</strong></p>
                            <p>Lanjutkan file <code>latihan.html</code> Anda. Tambahkan berbagai level heading di dalam <code>&lt;body&gt;</code>.</p>
                            <pre><code>&lt;!-- Di dalam tag &lt;body&gt; --&gt;
&lt;h1&gt;Judul Utama Artikel&lt;/h1&gt;
&lt;h2&gt;Sub-bab 1&lt;/h2&gt;
&lt;p&gt;Ini adalah konten untuk sub-bab pertama.&lt;/p&gt;
&lt;h3&gt;Detail untuk Sub-bab 1&lt;/h3&gt;
&lt;p&gt;Ini adalah detail lebih lanjut.&lt;/p&gt;
&lt;h2&gt;Sub-bab 2&lt;/h2&gt;
&lt;p&gt;Ini adalah konten untuk sub-bab kedua.&lt;/p&gt;</code></pre>
                        `},
                        { id: 'it10-7-topic4', name: 'Paragraf', content: `
                            <h4>Blok Teks - Tag Paragraf &lt;p&gt;</h4>
                            <p><strong>Fungsi:</strong> Membungkus blok teks menjadi satu paragraf. Browser secara otomatis akan memberikan jarak antar paragraf.</p>
                            <p class="mt-2"><strong>Aturan:</strong> Gunakan tag <code>&lt;p&gt;</code> baru untuk setiap paragraf baru.</p>
                            <p class="mt-4"><strong>Mari Kita Coba:</strong></p>
                            <pre><code>&lt;h2&gt;Kisah Saya&lt;/h2&gt;
&lt;p&gt;Ini adalah paragraf pertama dari kisah saya. Saya akan menceritakan tentang pengalaman belajar HTML.&lt;/p&gt;
&lt;p&gt;Ini adalah paragraf kedua. Ternyata belajar HTML sangat menyenangkan dan tidak sesulit yang saya bayangkan.&lt;/p&gt;</code></pre>
                        `},
                        { id: 'it10-7-topic5', name: 'Tautan &lt;a&gt;', content: `
                            <h4>Menghubungkan Dunia - Tag Tautan &lt;a&gt;</h4>
                            <p><strong>Fungsi:</strong> Membuat hyperlink ke halaman web lain atau ke bagian lain di halaman yang sama.</p>
                            <p class="mt-2"><strong>Atribut Penting:</strong> <code>href</code> (Hypertext Reference) untuk menentukan URL tujuan.</p>
                            <p class="mt-4"><strong>Mari Kita Coba:</strong></p>
                            <pre><code>&lt;p&gt;Untuk referensi lebih lanjut, Anda bisa mengunjungi &lt;a href="https://www.w3schools.com/html/"&gt;W3Schools HTML Tutorial&lt;/a&gt;.&lt;/p&gt;</code></pre>
                            <p class="mt-4"><strong>Mini Challenge:</strong> Buat tautan yang membuka di tab baru! (Petunjuk: Cari tahu tentang atribut \`target="_blank"\`)</p>
                        `},
                        { id: 'it10-7-topic6', name: 'Gambar &lt;img&gt;', content: `
                            <h4>Menambah Visual - Tag Gambar &lt;img&gt;</h4>
                            <p><strong>Fungsi:</strong> Menampilkan gambar di halaman web.</p>
                            <p class="mt-2"><strong>Atribut Wajib:</strong></p>
                            <ul class="list-disc list-inside mt-2 space-y-1">
                                <li><strong>src (Source):</strong> Alamat atau path dari file gambar.</li>
                                <li><strong>alt (Alternative Text):</strong> Teks deskripsi yang akan muncul jika gambar gagal dimuat. Penting untuk aksesibilitas!</li>
                            </ul>
                            <p class="mt-4"><strong>Mari Kita Coba:</strong></p>
                            <pre><code>&lt;h2&gt;Galeri Sederhana&lt;/h2&gt;
&lt;p&gt;Berikut adalah gambar acak dari internet:&lt;/p&gt;
&lt;img src="https://placehold.co/600x400" alt="Gambar placeholder abu-abu dengan ukuran 600x400"&gt;</code></pre>
                        `},
                        { id: 'it10-7-topic7', name: 'Pemisah', content: `
                            <h4>Pemisah dan Baris Baru - &lt;hr&gt; dan &lt;br&gt;</h4>
                            <p><strong>&lt;hr&gt; (Horizontal Rule):</strong> Membuat garis pemisah horizontal. Berguna untuk memisahkan bagian-bagian konten secara visual.</p>
                            <p class="mt-2"><strong>&lt;br&gt; (Break):</strong> Membuat baris baru tanpa memulai paragraf baru. Berguna untuk menulis puisi atau alamat.</p>
                            <p class="mt-4"><strong>Mari Kita Coba:</strong></p>
                            <pre><code>&lt;p&gt;Ini adalah bagian pertama dari konten.&lt;/p&gt;
&lt;hr&gt;
&lt;p&gt;Ini adalah bagian kedua, dipisahkan oleh sebuah garis.&lt;/p&gt;

&lt;p&gt;Mawar itu merah,&lt;br&gt;Violet itu biru,&lt;br&gt;Belajar HTML,&lt;br&gt;Sangat seru!&lt;/p&gt;</code></pre>
                        `},
                        { id: 'it10-7-topic8', name: 'Challenge', content: `
                            <h4>Challenge - Membuat Halaman "Profil Diri" Lengkap</h4>
                            <p>Sekarang giliran Anda! Gabungkan semua yang telah Anda pelajari hari ini untuk membuat halaman profil diri yang terstruktur dengan baik.</p>
                            <p class="mt-4"><strong>Instruksi:</strong></p>
                            <ol class="list-decimal list-inside mt-2 space-y-2">
                                <li>Buat file baru bernama <code>profil.html</code>.</li>
                                <li>Pastikan file tersebut memiliki struktur HTML yang benar (<code>&lt;!DOCTYPE&gt;</code>, <code>&lt;html&gt;</code>, <code>&lt;head&gt;</code>, <code>&lt;body&gt;</code>, dan <code>&lt;title&gt;</code>).</li>
                                <li>Gunakan <code>&lt;h1&gt;</code> untuk nama lengkap Anda.</li>

                        `},
                        { id: 'it10-7-topic9', name: 'Refleksi', content: `

                'it10-8': {
                    title: 'IT-10 - Meeting 8',
                    subtitle: 'Menambahkan Konten di HTML (List, Link, Gambar)',
                    tabs: [
                        { id: 'opening', name: 'Opening', content: openingTabContent },
                        { id: 'it10-8-warmup', name: 'Pemanasan', content: `
                            <h4>Membedah Situs Berita</h4>
                            <p>Mari kita buka salah satu situs berita populer (misalnya, Detik.com atau Kompas.com).</p>
                            <p class="mt-4"><strong>Pertanyaan untuk kelas:</strong></p>
                            <ul class="list-disc list-inside mt-2 space-y-2">
                                <li>"Selain judul dan paragraf, elemen apa lagi yang kalian lihat di halaman ini yang membuat informasinya lebih kaya?"</li>
                                <li>"Bagaimana cara situs ini menampilkan daftar berita terbaru? Apakah berurutan atau hanya poin-poin?"</li>
                                <li>"Apa yang terjadi jika kalian mengklik sebuah judul berita?"</li>
                                <li>"Elemen apa yang paling menarik perhatian kalian secara visual?"</li>
                            </ul>
                            <p class="mt-4">Diskusi ini akan mengarahkan siswa untuk mengidentifikasi elemen-elemen seperti daftar (list), tautan (link), dan gambar (image) sebagai komponen penting dalam sebuah halaman web modern.</p>
                        `},
                        { id: 'it10-8-topic1', name: 'Tag &lt;ul&gt; dan &lt;ol&gt;', content: `
                            <h4>Membuat Daftar - Tag &lt;ul&gt; dan &lt;ol&gt;</h4>
                            <p>Terkadang, kita perlu menyajikan informasi dalam bentuk daftar, bukan paragraf. HTML menyediakan dua cara utama untuk ini.</p>
                            <h5 class="font-semibold mt-6">1. Unordered List (&lt;ul&gt;) - Daftar Tak Berurutan</h5>
                            <p><strong>Fungsi:</strong> Untuk membuat daftar poin-poin di mana urutannya tidak penting. Setiap item dalam daftar akan ditandai dengan bullet point.</p>
                            <p class="mt-2"><strong>Analogi:</strong> Seperti daftar belanjaan atau daftar fitur sebuah produk.</p>
                            <p class="mt-2"><strong>Tag Pendukung:</strong> Setiap item di dalam <code>&lt;ul&gt;</code> harus dibungkus dengan tag <code>&lt;li&gt;</code> (List Item).</p>
                            <p class="mt-4"><strong>Mari Kita Coba: Membuat Daftar Hobi</strong></p>
                            <pre><code>&lt;h2&gt;Daftar Hobi Saya&lt;/h2&gt;
&lt;ul&gt;
    &lt;li&gt;Membaca Buku&lt;/li&gt;
    &lt;li&gt;Bermain Game&lt;/li&gt;
    &lt;li&gt;Mendengarkan Musik&lt;/li&gt;
    &lt;li&gt;Bersepeda&lt;/li&gt;
&lt;/ul&gt;</code></pre>
                            <h5 class="font-semibold mt-6">2. Ordered List (&lt;ol&gt;) - Daftar Berurutan</h5>
                            <p><strong>Fungsi:</strong> Untuk membuat daftar di mana urutannya sangat penting. Setiap item akan ditandai dengan angka (1, 2, 3, ...).</p>
                            <p class="mt-2"><strong>Analogi:</strong> Seperti langkah-langkah dalam resep, peringkat juara, atau instruksi perakitan.</p>
                            <p class="mt-2"><strong>Tag Pendukung:</strong> Sama seperti <code>&lt;ul&gt;</code>, setiap item di dalam <code>&lt;ol&gt;</code> harus dibungkus dengan tag <code>&lt;li&gt;</code>.</p>
                            <p class="mt-4"><strong>Mari Kita Coba: Membuat Langkah-langkah Menyeduh Kopi</strong></p>
                            <pre><code>&lt;h2&gt;Langkah-langkah Membuat Kopi Instan&lt;/h2&gt;
&lt;ol&gt;
    &lt;li&gt;Masak air hingga mendidih.&lt;/li&gt;
    &lt;li&gt;Masukkan kopi dan gula ke dalam cangkir.&lt;/li&gt;
    &lt;li&gt;Tuangkan air panas ke dalam cangkir.&lt;/li&gt;
    &lt;li&gt;Aduk hingga rata dan kopi siap dinikmati.&lt;/li&gt;
&lt;/ol&gt;</code></pre>
                        `},
                        { id: 'it10-8-topic2', name: 'Tag Tautan &lt;a&gt;', content: `
                            <h4>Menghubungkan Halaman - Tag Tautan &lt;a&gt;</h4>
                            <p>Tag <code>&lt;a&gt;</code> (anchor) adalah salah satu elemen paling kuat di HTML. Inilah yang membuat "web" menjadi "web" (jaringan), karena memungkinkan kita untuk menghubungkan halaman satu sama lain.</p>
                            <p class="mt-2"><strong>Fungsi:</strong> Membuat hyperlink yang bisa diklik.</p>
                            <p class="mt-2"><strong>Atribut Wajib:</strong> <code>href</code> (Hypertext Reference): Menentukan alamat URL tujuan dari tautan tersebut.</p>
                            <p class="mt-2"><strong>Atribut Penting Lainnya:</strong> <code>target="_blank"</code>: Membuat tautan terbuka di tab browser yang baru, sehingga halaman kita saat ini tidak tertutup.</p>
                            <p class="mt-4"><strong>Mari Kita Coba: Menambahkan Tautan Eksternal</strong></p>
                            <pre><code>&lt;p&gt;
    Saya sering mencari referensi pemrograman di 
    &lt;a href="https://developer.mozilla.org/en-US/" target="_blank"&gt;Mozilla Developer Network (MDN)&lt;/a&gt;. 
    Itu adalah sumber belajar yang sangat bagus.
&lt;/p&gt;</code></pre>
                        `},
                        { id: 'it10-8-topic3', name: 'Tag Gambar &lt;img&gt;', content: `
                            <h4>Menampilkan Visual - Tag Gambar &lt;img&gt;</h4>
                            <p>Gambar membuat halaman web menjadi lebih hidup dan menarik. Tag <code>&lt;img&gt;</code> digunakan untuk menyematkan gambar ke dalam halaman kita.</p>
                            <p class="mt-2"><strong>Penting:</strong> Tag <code>&lt;img&gt;</code> adalah tag kosong (empty tag), artinya ia tidak memiliki tag penutup.</p>
                            <p class="mt-2"><strong>Atribut Wajib:</strong></p>
                            <ul class="list-disc list-inside mt-2 space-y-1">
                                <li><strong>src (Source):</strong> Menentukan path atau URL dari file gambar yang ingin ditampilkan.</li>
                                <li><strong>alt (Alternative Text):</strong> Menyediakan teks deskriptif untuk gambar tersebut. Teks ini akan muncul jika gambar gagal dimuat dan sangat penting untuk aksesibilitas (dibacakan oleh screen reader).</li>
                            </ul>
                            <p class="mt-2"><strong>Atribut Tambahan yang Berguna:</strong> <code>width</code> dan <code>height</code>: Mengatur ukuran gambar secara manual.</p>
                            <p class="mt-4"><strong>Mari Kita Coba: Menambahkan Gambar Profil</strong></p>
                            <pre><code>&lt;h2&gt;Foto Profil&lt;/h2&gt;
&lt;img 
    src="https://placehold.co/200x200/orange/white?text=FOTO" 
    alt="Foto profil placeholder berwarna oranye"
    width="200"
    height="200"&gt;</code></pre>
                        `},
                        { id: 'it10-8-topic4', name: 'Aktivitas Utama', content: `
                            <h4>Aktivitas Utama</h4>
                            <h5 class="font-semibold mt-6">Bagian 1: Tutorial Live Coding (25 menit)</h5>
                            <p>Guru akan membuka proyek "Profil Diri" dari pertemuan sebelumnya dan mendemonstrasikan secara langsung cara menambahkan:</p>
                            <ul class="list-disc list-inside mt-2 space-y-1">
                                <li>Sebuah gambar profil di bawah <code>&lt;h1&gt;</code>.</li>
                                <li>Sebuah daftar hobi tak berurutan (<code>&lt;ul&gt;</code>) di bawah bagian "Hobi & Minat".</li>
                                <li>Sebuah daftar berurutan (<code>&lt;ol&gt;</code>) untuk "Top 3 Film Favorit".</li>
                                <li>Mengubah teks media sosial menjadi tautan <code>&lt;a&gt;</code> yang bisa diklik.</li>
                            </ul>
                            <h5 class="font-semibold mt-6">Bagian 2: Latihan - Perkaya Halaman "Profil Diri" Anda! (35 menit)</h5>
                            <p>Sekarang giliran Anda! Buka kembali file <code>profil.html</code> Anda dari pertemuan sebelumnya dan perbarui dengan elemen-elemen baru.</p>
                            <p class="mt-2"><strong>Tugas Anda:</strong></p>
                            <ol class="list-decimal list-inside mt-2 space-y-1">
                                <li><strong>Tambahkan Foto:</strong> Di bawah nama Anda (<code>&lt;h1&gt;</code>), tambahkan sebuah tag <code>&lt;img&gt;</code> untuk menampilkan foto profil. Gunakan https://placehold.co atau cari gambar online. Wajib sertakan atribut alt, width, dan height.</li>
                                <li><strong>Buat Daftar Hobi:</strong> Ubah paragraf di bagian "Hobi & Minat" menjadi sebuah daftar tak berurutan (<code>&lt;ul&gt;</code>). Setiap hobi harus menjadi item <code>&lt;li&gt;</code> tersendiri.</li>
                                <li><strong>Buat Daftar Favorit:</strong> Buat bagian baru dengan <code>&lt;h2&gt;</code> berjudul "Hal-hal Favorit". Di bawahnya, buatlah sebuah daftar berurutan (<code>&lt;ol&gt;</code>) yang berisi 3 hal favorit Anda (misal: makanan, film, buku, game).</li>
                                <li><strong>Aktifkan Tautan:</strong> Pastikan tautan media sosial yang Anda buat di pertemuan sebelumnya benar-benar bisa diklik dan mengarah ke profil Anda.</li>
                            </ol>
                        `},
                        { id: 'it10-8-topic5', name: 'Refleksi', content: `

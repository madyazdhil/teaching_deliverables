    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        
        /* New Color Palette */
        :root {
            --bg-light: #F8F9FA;
            --text-dark: #333745;
            --text-light: #6B7280;
            --border-soft: #E0E0E0;
            --primary-blue: #2596BE;
            --primary-yellow: #F7B32B;
            --accent-green: #2ECC71;
            --white: #FFFFFF;
        }
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-light);
            color: var(--text-dark);
        }

        .sidebar {
            width: 18rem;
            height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
            padding: 1rem;
            background-color: var(--white);
            border-right: 1px solid var(--border-soft);
        }

        .main-content {
            margin-left: 19rem; /* Adjusted for new sidebar width */
            padding: 2rem;
            width: calc(100% - 19rem);
        }

        .sidebar-link {
            display: block;
            padding: 0.75rem 1rem;
            border-radius: 0.5rem;
            font-weight: 500;
            color: var(--text-light);
            transition: all 0.2s ease-in-out;
        }

        .sidebar-link:hover {
            background-color: var(--bg-light);
            color: var(--text-dark);
        }
        
        .sidebar-link.active {
            background-color: var(--primary-yellow);
            color: var(--text-dark);
            font-weight: 600;
        }
        
        .accordion-header {
             cursor: pointer;
        }

        .accordion-content {
            display: none;
            overflow: hidden;
            padding-left: 1.5rem; /* Indent accordion content */
            margin-top: 0.5rem;
        }

        .accordion-content.active {
            display: block;
        }
        
        .tab-button {
            padding: 0.5rem 1rem;
            font-weight: 600;
            color: var(--text-light);
            border-bottom: 3px solid transparent;
            margin-bottom: -1px; /* Counteract the border-bottom on the container */
            transition: all 0.2s ease-in-out;
        }

        .tab-button.active {
            color: var(--primary-blue);
            border-bottom-color: var(--primary-blue);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }
        
        /* Custom card style */
        .card {
            background-color: var(--white);
            border-radius: 1rem;
            padding: 2rem;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
        }
        
        /* Prose styles for content inside tabs */
        .prose h4 {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 1rem;
        }
        .prose p, .prose li {
            font-size: 1rem;
            line-height: 1.75;
            color: var(--text-dark);
        }
         .prose a {
            color: var(--primary-blue);
            text-decoration: none;
            font-weight: 500;
        }
         .prose a:hover {
            text-decoration: underline;
        }
        .prose img {
            border-radius: 0.75rem;
        }
        .prose pre {
            background-color: #F3F4F6; /* bg-gray-100 */
            padding: 1rem;
            border-radius: 0.5rem;
            overflow-x: auto;
        }

        /* Hide scrollbar for Chrome, Safari and Opera */
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }

        /* Hide scrollbar for IE, Edge and Firefox */
        .hide-scrollbar {
            -ms-overflow-style: none;  /* IE and Edge */
            scrollbar-width: none;  /* Firefox */
        }
    </style>
</head>

                        { id: 'opening', name: 'Opening', content: openingTabContent },
                        { id: 'jhs5-topic1', name: 'Recap: CT', content: `
                            <h4>Waking Up Your Supercomputer Brain! 🧠</h4>
                            <p><strong>Mission Briefing: Remember Computational Thinking?</strong></p>
                            <p class="mt-4">A few lessons ago, we learned about Computational Thinking. It's not about thinking like a robot; it's about learning to solve complex problems using a clear, logical process, just like a computer scientist does.</p>
                            <p class="mt-4">You already learned the four secret powers of computational thinking:</p>
                            <ul class="list-disc list-inside mt-2 space-y-2">
                                <li><strong>Decomposition:</strong> Breaking big problems into small, manageable pieces.</li>
                                <li><strong>Pattern Recognition:</strong> Finding similarities or patterns to solve problems more efficiently.</li>
                                <li><strong>Abstraction:</strong> Focusing on the important details while ignoring the irrelevant ones.</li>

                            <p class="mt-4">Today, we're going to focus on <strong>Decomposition</strong> and <strong>Algorithms</strong>, and learn how to turn our plans into visual maps that anyone can understand!</p>

                            <h4>Your Problem-Solving Duo: Decomposition & Algorithms</h4>
                            <p>Let's do a quick refresh on our two most important tools for today.</p>
                            <div class="mt-6 p-6 bg-gray-50 rounded-lg border">
                                <h5 class="font-bold text-lg">1. Decomposition: The Art of the Chop!</h5>
                                <p class="mt-2">Decomposition is simply breaking a giant, scary problem into smaller, bite-sized chunks.</p>
                                <p class="mt-4"><strong>Big Problem:</strong> "Clean your room."</p>

                                <ul class="list-disc list-inside text-sm mt-2">

                                    <li>Put away all the clothes on the floor.</li>
                                    <li>Tidy the desk.</li>
                                    <li>Empty the trash can.</li>
                                </ul>

                                <p>In small groups, your mission is to write a perfect, super-detailed algorithm for making a peanut butter and jelly sandwich. Pretend you are writing instructions for a robot that has never seen a kitchen. What could go wrong if your steps are out of order or not specific enough?</p>
                            </div>
                        `},

                            <h4>Connecting Algorithms to Flowcharts 🗺️</h4>
                            <p>Writing an algorithm as a list of text is great, but sometimes it can be long, boring, or even a little confusing. What if we could draw our algorithm? That's exactly what a flowchart is!</p>
                            <p class="mt-4">A <strong>flowchart</strong> is a visual diagram that shows the steps and decisions in a process. It uses simple shapes and arrows to create a map of your algorithm that is easy to follow.</p>
                            <div class="mt-6 p-4 bg-blue-50 rounded-lg border border-blue-200">
                                <p><strong>Analogy:</strong></p>
                                <ul class="list-disc list-inside mt-2">
                                    <li>An <strong>algorithm</strong> is like turn-by-turn driving directions written in a list.</li>
                                    <li>A <strong>flowchart</strong> is like a map with the route highlighted.</li>
                                </ul>
                                <p class="mt-2">Both get you to the same destination, but the map (the flowchart) often helps you see the "big picture" more clearly.</p>
                            </div>
                        `},

                            <h4>Mission Briefing: From Paper to Pixels! ️</h4>
                            <p>You've learned how to think like a computer, and now it's time to use the tools of a digital designer. We will be using <strong>Draw.io</strong> (which is also called diagrams.net), a free and powerful online tool for creating professional diagrams, including flowcharts!</p>
                            <p class="mt-4"><strong>Let's Get Started:</strong></p>
                            <ol class="list-decimal list-inside mt-2 space-y-2">
                                <li>Open your web browser and go to <strong><a href="https://app.diagrams.net/" target="_blank">https://app.diagrams.net/</a></strong>.</li>
                                <li>The site will ask you where you want to save your diagram. For now, just choose <strong>"Decide Later"</strong>.</li>
                                <li>You now have a blank digital canvas ready for your ideas! On the left-hand side, you'll see a library of shapes. We'll be using the ones under the <strong>"Flowchart"</strong> section.</li>

                        ` },

                            <h4>Mastering the Symbols of Logic 🔷</h4>
                            <p>Every flowchart uses a standard set of symbols to represent different types of actions or decisions. Think of them as a universal language for logic! Here’s a breakdown of the most common symbols:</p>
                            <img src="/Users/user/Documents/Personal Project/Web-Dev/Learning_Material/materials/jhs-meet5/Syllabus Meeting 5 Designing Logic with Digital Fl 27c577100ed080b3ac54cbfb6920da71/image.png" alt="A flowchart diagram with symbols for start, process, and decision" class="my-6">
                            <ul class="list-disc list-inside space-y-3">
                                <li><strong>Terminator (Oval):</strong> Represents the <strong>Start</strong> and <strong>End</strong> points of your process.</li>
                                <li><strong>Process (Rectangle):</strong> Your main action symbol. It represents a step, a calculation, or an operation.</li>
                                <li><strong>Input/Output (Parallelogram):</strong> Used whenever the process needs to get information (input) or display information (output).</li>
                                <li><strong>Flow Line (Arrow):</strong> These are the connectors. They show the direction of the process.</li>
                            </ul>
                        ` },
                        { id: 'jhs5-topic6', name: 'Case Study: Sequence', content: `
                            <h4>Case Study: Making a Cup of Tea ☕</h4>
                            <p>A flowchart is like a visual recipe. It shows a series of steps in a specific order. This is called a <strong>sequence</strong>. Let's look at a simple, everyday task.</p>
                            <ul class="list-disc list-inside mt-4 space-y-3">
                                <li>You can't pour water before you boil it.</li>
                                <li>You can't add a tea bag to an empty cup.</li>
                                <li>Each step must follow the one before it.</li>
                            </ul>
                            <p class="mt-4">In programming, getting the sequence right is the most fundamental skill. Our first flowcharts will focus only on getting the steps in the correct order.</p>
                        ` },
                        { id: 'jhs5-topic7', name: 'Algorithm Breakdown', content: `
                            <h4>From Task to Algorithm 📝</h4>
                            <p>An <strong>algorithm</strong> is a clear, step-by-step list of instructions to complete a task. Let's turn our "Making a Cup of Tea" task into a simple algorithm.</p>

                                    <li>Start</li>
                                    <li>Boil water</li>
                                    <li>Put tea bag in cup</li>
                                    <li>Pour boiled water into cup</li>
                                    <li>Wait for tea to steep</li>
                                    <li>Remove tea bag</li>
                                    <li>End</li>
                                </ol>
                            </div>
                            <p class="mt-4">This plain-language algorithm is the "brain" of our flowchart. The next step is to translate it into visual symbols.</p>
                        `},
                        { id: 'jhs5-topic8', name: 'Guided Challenge', content: `
                            <h4>Let's Build Together!</h4>
                            <p>Before you try on your own, let's walk through two simple challenges as a class. We'll focus on using just the basic symbols.</p>

                        { id: 'jhs6-topic1', name: 'Refresher', content: `
                            <h4>Let's Revisit Our Flowchart Basics!</h4>
                            <p>Last time, we learned that a flowchart is a visual map of an algorithm. We used our first set of symbols to plan a simple process. Do you remember these?</p>
                            <ul class="list-disc list-inside mt-4 space-y-3">
                                <li><strong>Terminator (Oval):</strong> Used for the <strong>Start</strong> and <strong>End</strong> of our process.</li>

                            <p class="mt-4">Today, we're focusing on a powerful new symbol that makes our flowcharts "smart."</p>

                        { id: 'jhs6-topic2', name: 'The Decision Symbol', content: `
                            <h4>Making Your Flowchart "Smart" 🧠</h4>
                            <p>What makes a process interesting? The ability to make <strong>choices</strong>! In a flowchart, we use the <strong>Decision (Diamond)</strong> symbol to ask a question.</p>
                            <p class="mt-4">A <strong>Decision diamond</strong> always asks a question that can be answered with <strong>"Yes"</strong> or <strong>"No"</strong> (or "True"/"False"). Because there are two possible answers, there will always be <strong>two arrows</strong> coming out of a diamond, one for each path. This allows our flowchart to change its behavior based on a <strong>condition</strong>.</p>
                            <p class="mt-6">Here is an example of a decision or a condition used in a flowchart:</p>
                            <img src="https://encrypted-tbn3.gstatic.com/licensed-image?q=tbn:ANd9GcQBCyNN6fH5BGC7WfkasrTX4W6HXCQ6apxA1Dhbf9l8yM6dZbtob7Sv6-0-cRifuJ6b1YbMGdqa6shSWGgCfdJa0MtlCOdXKoanMmie2PnYilSAKvk" alt="Flowchart example showing a decision diamond" class="my-4 mx-auto"/>
                        `},
                        { id: 'jhs6-topic3', name: 'Decision Case Studies', content: `
                            <h4>Decisions in Action - Case Studies</h4>
                            <p>Let's see how this works with some real-world examples.</p>
                            <div class="mt-6 p-4 bg-gray-50 rounded-lg border">
                                <p class="font-semibold">Case Study #1: The Umbrella Dilemma ☔</p>
                                <p class="text-sm text-gray-600 mt-2"><strong>Problem:</strong> Should you take an umbrella when you leave the house? The answer depends on the weather. The key question is: <strong>Is it raining?</strong> If YES, take an umbrella. If NO, wear sunglasses.</p>
                                <button class="internal-accordion-btn mt-4 text-sm font-semibold text-blue-600">Show Algorithm ▼</button>
                                <div class="internal-accordion-content hidden mt-4 pt-4 border-t">
                                    <p><strong>Algorithm:</strong></p>
                                    <ol class="list-decimal list-inside text-sm">
                                        <li>Start</li>
                                        <li>Look outside.</li>
                                        <li>Is it raining?</li>
                                        <li>If YES, take an umbrella.</li>
                                        <li>If NO, wear sunglasses.</li>
                                        <li>End</li>
                                    </ol>
                                </div>
                            </div>
                            <div class="mt-4 p-4 bg-gray-50 rounded-lg border">
                                <p class="font-semibold">Case Study #2: The Secret Password 🔑</p>
                                <p class="text-sm text-gray-600 mt-2"><strong>Problem:</strong> A user is trying to log into a game. They should only get in if they enter the correct password. If YES, display "Welcome!". If NO, display "Access Denied."</p>
                                <button class="internal-accordion-btn mt-4 text-sm font-semibold text-blue-600">Show Algorithm ▼</button>
                                <div class="internal-accordion-content hidden mt-4 pt-4 border-t">
                                    <p><strong>Algorithm:</strong></p>
                                    <ol class="list-decimal list-inside text-sm">
                                        <li>Start</li>
                                        <li>Ask for password (Input).</li>
                                        <li>Is password "Secret123"?</li>
                                        <li>If YES, display "Welcome!".</li>
                                        <li>If NO, display "Access Denied.".</li>
                                        <li>End</li>
                                    </ol>
                                </div>
                            </div>
                        `},
                        { id: 'jhs6-topic4', name: 'How Loops Work', content: `
                            <h4>The Never-Ending Story: How Loops Work 🔁</h4>
                            <p>Does a traffic light change colors once and then stop forever? No! It repeats its pattern over and over. This is a <strong>loop</strong>. A loop is a way to repeat a set of actions.</p>
                            <p class="mt-4">In a flowchart, we show a loop simply by drawing a <strong>flow line (arrow)</strong> from a later step <strong>back to an earlier step</strong>. This creates a cycle that can repeat.</p>
                        `},
                        { id: 'jhs6-topic5', name: 'Group Challenge', content: `
                            <h4>Your Mission: Control the Intersection! 🚦</h4>
                            <p>It's time to combine everything: sequencing, decisions (implied by timers), and loops. Your challenge is to create a flowchart for a simple traffic light.</p>
                            <p class="mt-4"><strong>The Logic to Map:</strong></p>
                            <ol class="list-decimal list-inside mt-2 space-y-1">
                                <li>Start</li>

                                <li>Wait for 30 seconds.</li>
                                <li>Turn the main street light <strong>Yellow</strong>.</li>
                                <li>Wait for 5 seconds.</li>
                                <li>Turn the main street light <strong>Red</strong>.</li>
                                <li><strong>Loop!</strong> Go back to step 2 and repeat the cycle forever.</li>
                            </ol>
                        `},

                        { id: 'jhs7-topic1', name: 'Intro Challenge', content: `

                        { id: 'jhs7-topic2', name: 'What is Pseudocode?', content: `
                            <h4>What is this "Pseudocode" thing? 🤔</h4>
                            <p>You've just seen that plain English can be a bit of a disaster for giving instructions. <strong>Pseudocode</strong> is our solution.</p>
                            <p class="mt-4"><strong>Analogy:</strong> Think of it like a middle ground. It's not as strict as a real programming language (like Python or JavaScript), but it's much more organized and clear than just talking. It's like a <strong>structured recipe</strong> that a computer can almost understand.</p>
                            <p class="mt-4">Today, you will learn to translate your flowchart "drawings" into these structured "recipes." This is the last step you take before writing real, working code.</p>
                        `},
                        { id: 'jhs7-topic3', name: 'Translation Guide', content: `
                            <h4>Teacher Demonstration: From a Sandwich Flowchart to Pseudocode</h4>
                            <p><strong>Step 1: The Flowchart</strong><br>First, let's look at a flowchart that finds the larger of two numbers. Notice the different shapes for input, decisions, and output.</p>
                            <img src="https://media.geeksforgeeks.org/wp-content/uploads/20241015145101770742/example.png" alt="Flowchart for finding the larger of two numbers" class="my-6 mx-auto">
                            
                            <div class="overflow-x-auto mt-6">
                                <table class="w-full text-left border-collapse">
                                    <thead>
                                        <tr class="bg-gray-100">
                                            <th class="p-2 border">Flowchart Symbol</th>
                                            <th class="p-2 border">Pseudocode Keyword/Structure</th>
                                            <th class="p-2 border">Example</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <tr class="border-t">
                                            <td class="p-2 border"><strong>Oval (Start/End)</strong></td>
                                            <td class="p-2 border"><code>START</code> / <code>END</code></td>
                                            <td class="p-2 border"><code>START ... END</code></td>
                                        </tr>
                                        <tr class="border-t">
                                            <td class="p-2 border"><strong>Rectangle (Process)</strong></td>
                                            <td class="p-2 border">A clear command</td>
                                            <td class="p-2 border"><code>Get two slices of bread</code></td>
                                        </tr>
                                        <tr class="border-t">
                                            <td class="p-2 border"><strong>Diamond (Decision)</strong></td>
                                            <td class="p-2 border"><code>IF-THEN-ENDIF</code></td>
                                            <td class="p-2 border"><code>IF cheese is wanted THEN<br>&nbsp;&nbsp;&nbsp;&nbsp;Add a slice of cheese<br>ENDIF</code></td>
                                        </tr>
                                        <tr class="border-t">
                                            <td class="p-2 border"><strong>Diamond (Decision with a "No" path)</strong></td>
                                            <td class="p-2 border"><code>IF-THEN-ELSE-ENDIF</code></td>
                                            <td class="p-2 border"><code>IF it is raining THEN<br>&nbsp;&nbsp;&nbsp;&nbsp;Take umbrella<br>ELSE<br>&nbsp;&nbsp;&nbsp;&nbsp;Wear sunglasses<br>ENDIF</code></td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>

                            <p class="mt-6"><strong>Step 2: The Translation</strong><br>Now, let's write the pseudocode for our number comparator program. We'll use the keywords we've learned to give it structure.</p>

                            <button class="internal-accordion-btn mt-6 text-sm font-semibold text-blue-600">Show Pseudocode ▼</button>
                            <div class="internal-accordion-content hidden mt-4 pt-4 border-t">
                                <p>Here is the simple pseudocode for the given flowchart:</p>
                                <pre class="bg-gray-100 p-4 rounded-lg mt-2"><code>BEGIN
    INPUT num1
    INPUT num2

    IF num1 > num2 THEN
        DISPLAY num1
    ELSE
        DISPLAY num2
    END IF
END</code></pre>
                                <p class="mt-4"><strong>Explanation:</strong></p>
                                <ul class="list-disc list-inside space-y-2">
                                    <li><strong>BEGIN/END:</strong> These mark the start and stop points of the algorithm, corresponding to the ovals in the flowchart.</li>
                                    <li><strong>INPUT num1, INPUT num2:</strong> These lines represent the two parallelogram shapes, where the program prompts the user to enter two numbers.</li>
                                    <li><strong>IF num1 > num2 THEN ... ELSE ... END IF:</strong> This block corresponds to the diamond (decision) shape. It checks if num1 is greater than num2 and follows the appropriate path.</li>
                                    <li><strong>DISPLAY:</strong> This keyword represents the output operation (the parallelogram shapes for displaying the result).</li>
                                </ul>
                            </div>
                        `},

                    tabs: [
                        { id: 'opening', name: 'Opening', content: openingTabContent },
                        { id: 'jhs9-warmup', name: 'Warm-Up', content: `
                            <h4>Warm-Up Discussion</h4>
                            <p>Let's start by thinking about the apps we use every day.</p>
                            <img src="https://thesun.my/binrepository/pexels-lisa-fotios-1092644_3212765_20230607112851.jpg" alt="Person using a smartphone" class="my-6">
                            <p class="mt-4"><strong>Question for the class:</strong> "What app on your phone do you use the most? (e.g., TikTok, Mobile Legends, Gojek, YouTube). Why do you like it so much? Is it because:</p>

                                <li>It looks great? (Cool colors, fun images, easy-to-read text)</li>
                                <li>Or because it's super easy to use? (Not confusing, buttons are easy to find, you don't have to think too much)</li>
                            </ul>
                            <p class="mt-4">Without realizing it, you've just discussed the two most important things in the tech world: UI and UX. Let's break them down!</p>
                        `},
                        { id: 'jhs9-topic1', name: 'What is UX?', content: `
                            <h4>UX - Making an App "Connect" with Your Brain 🧠</h4>
                            <img src="https://course-net.com/wp-content/uploads/2023/03/1_Fp4GIm568zHv17pgJTbxPQ.png" alt="Diagram showing the difference between UI and UX" class="my-6">
                            <p><strong>UX (User Experience)</strong> is all about the FEELING. It's not what you see, but what you feel when you use an app. Do you feel smart? Comfortable? Or confused and frustrated?</p>
                            <p class="mt-4">The main goal of UX is to make an app logical, easy, and enjoyable to use.</p>
                            <h5 class="font-semibold mt-6">Simple Analogy: PlayStation Controller vs. Old TV Remote</h5>
                            <ul class="list-disc list-inside mt-2 space-y-2">
                                <img src="https://cdn.mos.cms.futurecdn.net/UicrjyT3eTVpnnGe8T5FNa.jpg" alt="A person holding a PlayStation controller" class="my-6">
                                <li><strong>Good UX (PlayStation Controller):</strong> The buttons are placed exactly where your fingers naturally rest. You don't need to look down to press X or R1. Everything feels natural and fast. You can focus on the game, not the controller.</li>
                                <img src="https://content.logoscreative.com/content/uploads/2014/09/27183123/meaningful-ux-at-any-scale-10-638.jpg" alt="A confusing and poorly designed remote control" class="my-6">
                                <li><strong>Bad UX (Old TV Remote):</strong> Ever seen a remote with 50 tiny, similar-looking buttons? You have to hunt for the "Menu" or "Input" button. You get frustrated and focus more on finding the button than watching TV.</li>
                            </ul>
                            <h5 class="font-semibold mt-6">Key Concepts of UX:</h5>
                            <ul class="list-disc list-inside mt-2 space-y-2">
                                <li><strong>User Flow:</strong> How easily can you get from point A to point B? (e.g., from opening Gojek to ordering a Go-Ride). A good user flow is smooth and has as few steps as possible.</li>
                                <li><strong>Pain Points:</strong> What parts of the app are annoying or confusing? A UX designer's job is to find and fix these "pain points."</li>
                            </ul>
                            <p class="mt-4">In short, if an app feels like it "connects" with your brain and doesn't make you think too hard, it has <strong>good UX</strong>.</p>
                        `},
                        { id: 'jhs9-activity1', name: 'Teacher Activity: Bad UX Hunt', content: `
                            <h4>Teacher-Led Activity: Bad UX Treasure Hunt</h4>
                            <p>Let's explore a website that was designed to have terrible UX on purpose. This is a fun way to see what NOT to do.</p>
                            <p class="mt-4"><strong>Teacher:</strong> Share your screen and navigate to <a href="https://userinyerface.com/" target="_blank">userinyerface.com</a>.</p>
                            <p class="mt-4"><strong>Activity:</strong></p>
                            <ol class="list-decimal list-inside mt-2 space-y-2">
                                <li>As a class, try to complete the form on the website as quickly as possible.</li>
                                <li>As you encounter problems (like confusing buttons, impossible password rules, etc.), call them out!</li>
                                <li>Discuss: What specific "pain points" did the designers create? How would you fix them?</li>
                            </ol>
                            <p class="mt-4">This exercise highlights how frustrating bad UX can be, even when the UI (colors, fonts) might look okay.</p>
                        `},
                        { id: 'jhs9-topic2', name: 'What is UI?', content: `
                            <h4>UI - Making an App "Easy on the Eyes" ✨</h4>
                            <p><strong>UI (User Interface)</strong> is all about the LOOK. It's everything visual you see on the screen, from the color of the buttons, the shape of the icons, the type of font, to the images displayed.</p>
                            <p class="mt-4">The main goal of UI is to make an app visually appealing and guide the user's eyes to the important parts.</p>
                            <h5 class="font-semibold mt-6">Simple Analogy: Your Bedroom</h5>
                            <ul class="list-disc list-inside mt-2 space-y-2">
                                <li><strong>UX is the layout:</strong> Where are the door, window, and closet so you can move around easily?</li>
                                <li><strong>UI is the decoration:</strong> What color are the walls? What posters are up? What color is your bedspread? This is the UI that gives your room "style."</li>
                            </ul>
                            <img src="https://cdn.prod.website-files.com/678a08d17a6b88bae4e2d8ee/67931a046ea5a2c70aa2c4bf_66b0929089fba41bd4d24821_Key-Differences-Between-UX-Designer-vs.-UI-Designer.png" alt="A diagram showing UI elements like color and typography" class="my-6">
                            <h5 class="font-semibold mt-6">Key Elements of UI:</h5>
                            <ul class="list-disc list-inside mt-2 space-y-2">
                                <li><strong>Color:</strong> Why is Gojek green and Shopee orange? Color creates identity and can affect your mood.</li>
                                <img src="https://miro.medium.com/0*WcgQYtChI6MTHRZE" alt="UI Color Palette Example" class="my-4 w-1/2 mx-auto">
                                <li><strong>Typography (Fonts):</strong> News apps use formal, easy-to-read fonts. Apps for kids might use more playful fonts.</li>
                                <img src="https://userpeek.com/wp-content/uploads/2022/03/Typefaces.png" alt="UI Typography Example" class="my-4 w-1/2 mx-auto">
                                <li><strong>Icons:</strong> Icons are a universal language. You know 🏠 means "Home" and 🔍 means "Search."</li>
                                <img src="https://thumbs.dreamstime.com/b/basic-ui-element-icons-outline-style-perfect-web-mobile-application-161489352.jpg" alt="UI Icons Example" class="my-4 w-1/2 mx-auto">
                                <li><strong>Buttons & Images:</strong> Good UI makes buttons look clickable and uses high-quality images.</li>
                                <img src="https://media.nngroup.com/media/editor/2025/02/19/button.jpg" alt="UI Buttons Example" class="my-4 w-1/2 mx-auto">
                            </ul>
                            <p class="mt-4">In short, if an app makes you think, "Wow, this looks amazing!", it has <strong>good UI</strong>.</p>
                        `},
                        { id: 'jhs9-activity2', name: 'Teacher Activity: UI Deconstruction', content: `
                            <h4>Teacher-Led Activity: UI Deconstruction</h4>
                            <p>Now let's look at a website with excellent UI and break down why it works so well.</p>
                            <p class="mt-4"><strong>Teacher:</strong> Share your screen and navigate to a visually appealing website, for example, the <a href="https://www.apple.com/" target="_blank">Apple homepage</a>.</p>
                            <p class="mt-4"><strong>Activity:</strong></p>
                            <ol class="list-decimal list-inside mt-2 space-y-2">
                                <li>Point out the key UI elements we just learned about.</li>
                                <li><strong>Color Palette:</strong> "What colors do you see? Are they bright and playful, or simple and professional? Why do you think they chose these colors?"</li>
                                <li><strong>Typography:</strong> "Look at the main title versus the smaller text. How is the font different? Why?"</li>
                                <li><strong>Layout & Spacing:</strong> "Notice how much empty space (whitespace) there is. Does it feel crowded or clean? How does this help you focus?"</li>
                                <li><strong>Consistency:</strong> "Look at the buttons. Do they all look similar? This is called consistency, and it helps users know what to expect."</li>
                            </ol>
                            <p class="mt-4">This helps students develop an eye for what makes a design feel professional and easy to look at.</p>
                        `},
                        { id: 'jhs9-topic3', name: 'UI vs. UX', content: `
                            <h4>UI vs. UX: The Partnership</h4>
                            <p>So, what's the difference? Think of the classic Heinz ketchup bottle.</p>
                            <img src="https://miro.medium.com/v2/resize:fit:800/1*Cl3Fk9iEFz9ZKhvaSVgqpA.jpeg" alt="UI vs UX ketchup bottle analogy" class="my-6">
                            <ul class="list-disc list-inside mt-2 space-y-2">
                                <li>The original glass bottle had a great <strong>UI</strong>. The label was iconic and it looked beautiful on the table.</li>
                                <li>But the <strong>UX</strong> was terrible! You had to hit the bottom of the bottle forever just to get a little bit of ketchup out.</li>
                                <li>The new squeeze bottle might not look as "classic" (some might say the UI is less elegant), but the <strong>UX</strong> is fantastic. It's easy to use and you get the ketchup out with no frustration.</li>
                            </ul>
                            <p class="mt-4"><strong>The best products have BOTH great UI and great UX.</strong> They look amazing AND are a joy to use.</p>
                        `},
                        { id: 'jhs9-main-activity', name: 'Group Mission: Redesign Challenge', content: `
                            <h4>Group Mission: The App Redesign Challenge!</h4>
                            <p>Now it's your turn to be design detectives!</p>
                            <ol class="list-decimal list-inside mt-4 space-y-2">
                                <li><strong>Form Groups:</strong> Work in pairs or small groups.</li>
                                <li><strong>Your Mission:</strong> The teacher will provide a screenshot of a poorly designed app interface. Your job is to redesign it.</li>
                                <li><strong>Document on Jamboard/Slides:</strong>
                                    <ul class="list-disc list-inside ml-4 mt-2 space-y-1">
                                        <li><strong>Analyze the Bad Design:</strong> First, list all the UI and UX problems with the original screenshot. What is confusing? What looks bad?</li>
                                        <li><strong>Sketch Your Redesign:</strong> You don't need to be an artist! Draw a simple sketch of your new, improved screen layout.</li>
                                        <li><strong>Explain Your Choices:</strong> Write short notes explaining WHY you made your changes. (e.g., "We made the 'Submit' button bigger and green so it's easier to see (Good UI). We also moved it to the bottom where users expect it to be (Good UX).")</li>
                                    </ul>
                                </li>
                            </ol>
                        `},
                        { id: 'jhs9-presentations', name: 'Presentations', content: `
                            <h4>Show and Tell: Present Your Redesign</h4>
                            <p>Each group will have 2-3 minutes to present their redesign to the class.</p>
                            <ol class="list-decimal list-inside mt-4 space-y-2">
                                <li>Show the original "bad" design.</li>
                                <li>Show your new sketch.</li>
                                <li>Explain the top 2-3 most important changes you made and how they improve the UI and UX.</li>
                            </ol>
                            <p class="mt-4">This is a great chance to see how different groups solved the same problem and to practice explaining design decisions.</p>
                        `},
                        { id: 'jhs9-reflection', name: 'Reflection', content: `
                            <h4>Final Reflection</h4>
                            <p>Let's reflect on what we've learned.</p>
                            <img src="https://amadine.com/assets/img/articles/ux-vs-ui/ux-vs-ui-design@2x.png" alt="UI vs UX comparison" class="my-6">
                            <p class="mt-4"><strong>Reflection Question:</strong> "After today's lesson, which do you think is more important for a user: a good look (UI) or ease of use (UX)? Why? Can an app succeed with only one?"</p>
                            <p class="mt-2">Discuss your answer with a partner before we discuss it as a class.</p>
                        `},

                'jhs-10': {
                    title: 'JHS - Meeting 10',
                    subtitle: 'Designing User Flow',
                    tabs: [
                        { id: 'opening', name: 'Opening', content: openingTabContent },
                        { id: 'jhs10-warmup', name: 'Warm-Up', content: `
                            <h4>Warm-Up: Guess the Symbol!</h4>
                            <p>Welcome back, logic designers! In the previous unit, we learned how to create flowcharts to map out algorithms and processes, like a traffic light.</p>
                            <p class="mt-4">For a warm-up, let's remember what these symbols mean. Try to name the function of each symbol I show!</p>
                            <ul class="list-disc list-inside mt-4 space-y-2">
                                <li><strong>Oval:</strong> Start/End</li>
                                <li><strong>Rectangle:</strong> Process/Action</li>
                                <li><strong>Parallelogram:</strong> Input/Output</li>
                                <li><strong>Diamond:</strong> Decision</li>
                            </ul>
                            <p class="mt-4">Excellent! Today, we're going to use the same flowchart power, but for a new purpose: mapping a user's journey within an application.</p>
                        `},
                        { id: 'jhs10-topic1', name: 'What is User Flow?', content: `
                            <h4>Introducing the Application "Journey Map"</h4>
                            <p>In our last meeting, we discussed UX (User Experience), which is the "feel" of using a product. To make that "feel" pleasant and not confusing, a UX designer must design a map. This map is called a <strong>User Flow</strong>.</p>
                            <p class="mt-4"><strong>Analogy:</strong> Imagine an application is a large amusement park.</p>
                            <p class="mt-2">A User Flow is the path map you design for visitors. This map shows: "From the Entrance (Start), you walk straight (Process), then at the intersection you can choose (Decision) to go to the roller coaster (Process A) or the haunted house (Process B), and then you exit through the Souvenir Shop (End)."</p>
                            <p class="mt-4">So, a User Flow is a diagram of the steps a user must take within an application to complete a task. The goal? To ensure users don't get "lost" or confused when trying to do something in our app.</p>
                        `},
                        { id: 'jhs10-topic2', name: 'Why User Flow is Important', content: `
                            <h4>Why Make a Map First? The Importance of User Flow</h4>
                            <p>This is a crucial question. Why don't we just start building the application? Why bother drawing flows on paper or a Jamboard?</p>
                            <p class="mt-4">The answer is simple: <strong>It's much easier (and cheaper) to erase a drawing on paper than to dismantle 1,000 lines of code.</strong></p>
                            <h5 class="font-semibold mt-6">Analogy 1: Building a House 🏠</h5>
                            <p>Imagine you want to build a house. Would you just call a builder and say, "Sir, please build a house here," without giving them a blueprint? Of course not! If you did, the builder would be confused, might build a bathroom without a door, or forget the kitchen entirely. When you realize the kitchen is in the wrong place, you have to tear down walls. This wastes time, effort, and money. A User Flow is the <strong>BLUEPRINT</strong> of your application.</p>
                            <h5 class="font-semibold mt-6">Analogy 2: Making a Movie 🎬</h5>
                            <p>A film director doesn't just start shooting. They create a <strong>Storyboard</strong>, which is a sketch of scene after scene. The storyboard helps the director see if the story makes sense before spending billions on filming. A User Flow is the <strong>STORYBOARD</strong> of your application.</p>
                            <h5 class="font-semibold mt-6">What are the Benefits?</h5>
                            <ul class="list-disc list-inside mt-2 space-y-2">
                                <li><strong>Find Problems Early:</strong> You can spot "dead ends" or confusing paths on paper. ("Wait, if the user enters the wrong password, where do they go? Oh, we forgot that flow!").</li>
                                <li><strong>Save Time and Effort:</strong> It's faster to fix a flow by moving boxes on a Jamboard than to change already written code.</li>
                                <li><strong>Focus on the User:</strong> It forces us to think like a user, not a programmer. We focus on "What is easiest for the user?" not "What is fastest to code?".</li>
                                <li><strong>Team Alignment:</strong> Designers, programmers, and project managers can all see and agree on the flow before work begins.</li>
                            </ul>
                        `},
                        { id: 'jhs10-topic3', name: 'Case Study: GoFood', content: `
                            <h4>Case Study - Dissecting the "Order GoFood" Flow</h4>
                            <p>Let's take a common example: ordering food. The task is "User orders Crazy Fried Rice." What does the flowchart look like?</p>
                            <p class="mt-4">Here is a step-by-step breakdown:</p>
                            <ol class="list-decimal list-inside mt-2 space-y-2">
                                <li><strong>[Oval] Start:</strong> User opens the Gojek app.</li>
                                <li><strong>[Parallelogram] Input:</strong> User types "Crazy Fried Rice" in the GoFood search bar.</li>
                                <li><strong>[Process] Process:</strong> App displays a list of restaurants.</li>
                                <li><strong>[Process] Process:</strong> User selects one restaurant.</li>
                                <li><strong>[Process] Process:</strong> User presses the "Add" button on the Crazy Fried Rice menu.</li>
                                <li><strong>[Process] Process:</strong> User presses the "Cart" button.</li>
                                <li><strong>[Process] Process:</strong> User presses "Order".</li>
                                <li><strong>[Diamond] Decision:</strong> "Have a discount voucher?"
                                    <ul class="list-disc list-inside ml-4">
                                        <li><strong>YES:</strong> [Process] User selects voucher -> Return to main flow.</li>
                                        <li><strong>NO:</strong> Continue to main flow.</li>
                                    </ul>
                                </li>
                                <li><strong>[Diamond] Decision:</strong> "Payment Method?"
                                    <ul class="list-disc list-inside ml-4">
                                        <li><strong>GoPay:</strong> [Process] Check balance -> [Process] Confirm Order.</li>
                                        <li><strong>Cash:</strong> [Process] Confirm Order.</li>
                                    </ul>
                                </li>
                                <li><strong>[Oval] End:</strong> Order is confirmed and a driver is found.</li>
                            </ol>
                            <p class="mt-4">See? A seemingly complex journey can be clearly mapped using the symbols we've already learned!</p>
                        `},
                        { id: 'jhs10-examples', name: 'Flowchart Examples', content: `
                            <h4>User Flow Examples</h4>
                            <p>Here are a couple of real-world examples of user flows to help you visualize how different processes are mapped out.</p>
                            
                            <h5 class="font-semibold mt-6">E-commerce Order Process</h5>
                            <p>This flowchart shows the typical journey a user takes from searching for a product to completing a purchase on an e-commerce site.</p>
                            <img src="https://creately.com/static/assets/guides/user-flow-diagram/e-commerce-order-process-flowchart.webp" alt="E-commerce order process flowchart" class="my-6">

                            <h5 class="font-semibold mt-6">User Login & Registration Flow</h5>
                            <p>This example maps out two critical user tasks: logging into an existing account and registering for a new one. Notice how the 'Decision' diamond is used to direct the user based on whether they are a new or returning user.</p>
                            <img src="https://b13.com/fileadmin/_processed_/6/4/csm_UserFlowGuide_Example_3dc0e620a3.webp" alt="User login and account registration flowchart" class="my-6">
                        `
                        },
                        { id: 'jhs10-topic4', name: 'Main Activity', content: `
                            <h4>Main Activity - User Flow Architect Challenge!</h4>
                            <h5 class="font-semibold mt-6">Part 1: Group Division & Scenarios</h5>
                            <p>Now it's your turn to be User Journey Architects! You will be divided into small groups. Each group will receive a large sheet of paper and markers, or a Jamboard page. Each group gets a different scenario to map out.</p>
                            <h5 class="font-semibold mt-6">Scenario List:</h5>
                            <ul class="list-disc list-inside mt-2 space-y-2">
                                <li><strong>Scenario A:</strong> "Registering a New Social Media Account"</li>
                                <li><strong>Scenario B:</strong> "Buying Mobile Credit on an E-Wallet App"</li>
                                <li><strong>Scenario C:</strong> "The 'Forgot Password' Process"</li>
                                <li><strong>Scenario D:</strong> "Uploading a Video to TikTok/Reels"</li>
                                <li><strong>Scenario E:</strong> "Checking Out an Item in E-commerce"</li>
                                <li><strong>Scenario F:</strong> "Booking an Online Motorcycle Taxi (GoRide/GrabBike)"</li>
                                <li><strong>Scenario G:</strong> "Saving a Video to a YouTube Playlist"</li>
                                <li><strong>Scenario H:</strong> "Setting an Alarm on a Phone"</li>
                            </ul>
                            <h5 class="font-semibold mt-6">Part 2: Group Practice - Create the Journey Map</h5>
                            <p>Discuss in your group and create a user flow flowchart for your chosen scenario. Remember to use the correct symbols for Start, End, Input, Process, and especially Decisions for important branches in the flow.</p>
                            <h5 class="font-semibold mt-6">Part 3: "Gallery Walk" - User Flow Exhibition</h5>
                            <p>Once done, each group will display their flowchart. You will then walk around to see and analyze the work of other groups. This is a chance to see how different flows are designed for different tasks.</p>
                        `},
                        { id: 'jhs10-topic5', name: 'Reflection', content: `
                            <h4>Closing - Discussion & Reflection</h4>

                'jhs-11': {
                    title: 'JHS - Meeting 11',
                    subtitle: 'Translating Flow into Display (Wireframe)',
                    tabs: [
                        { id: 'opening', name: 'Opening', content: openingTabContent },
                        { id: 'jhs11-warmup', name: 'Warm-Up: From Map to Floor Plan', content: `
                            <h4>Connecting the Last Meeting</h4>
                            <p>Welcome back, designers!</p>
                            <ul class="list-disc list-inside mt-4 space-y-2">
                                <li>In Meeting 9, we learned the difference between UX (the comfortable feeling) and UI (the cool look).</li>
                                <img src="https://amadine.com/assets/img/articles/ux-vs-ui/ux-vs-ui-design@2x.png" alt="UI vs UX comparison" class="my-6">
                                <li>In Meeting 10, we created a <strong>JOURNEY MAP (User Flow)</strong> for our application. We know the flow and the steps the user will take.</li>
                                <img src="https://cdn.sanity.io/images/599r6htc/regionalized/1ed7c3cf44293ac1ad87f33f0b0b8d2132ba75bd-2880x1440.png" class="my-6">
                            </ul>
                            <p class="mt-4">Now the question is: <strong>"What does each step look like?"</strong></p>

                            <h5 class="font-semibold mt-6">Show & Tell: Final Design vs. Sketch</h5>
                            <p>Let's look at two images: one is a rough, black-and-white sketch (a <strong>Low-Fidelity or Lo-Fi Wireframe</strong>), and the other is a final, colorful design (a <strong>High-Fidelity or Hi-Fi Design</strong>). Both show the same page.</p>
                            <img src="https://b1206693.smushcdn.com/1206693/uploads/2024/04/Wireframes-to-Design-1200x742.png?lossy=0&strip=1&webp=1" alt="Comparison of Low-Fidelity Wireframe and High-Fidelity Design" class="my-6">

                            <h5 class="font-semibold mt-6">Warm-Up Discussion</h5>
                            <p><strong>Question for the class:</strong> "Why do designers bother making gray sketches first? Why not just go straight to making a beautiful, colorful design?"</p>
                            <p class="mt-2 text-gray-600">Let's discuss ideas like speed, ease of making changes, and focusing on layout before colors. This is a key part of UX: making sure all the steps from our User Flow are included in the layout!</p>
                        `},
                        { id: 'jhs11-topic1', name: 'What is a Wireframe?', content: `
                            <h4>Wireframe - The Page Blueprint</h4>
                            <p>A <strong>Wireframe</strong> is a simple sketch that shows the layout of elements on a website or application page. It is the "blueprint" of a page.</p>
                            <img src="https://assets.justinmind.com/wp-content/uploads/2024/07/trip-tracker-app-sketch-example.png" alt="Wireframe vs Mockup vs Prototype" class="my-6">

                            <h5 class="font-semibold mt-6">Analogy (Remember This!)</h5>
                            <ul class="list-disc list-inside mt-2 space-y-2">
                                <li>A <strong>User Flow</strong> (from last week) is the <strong>Amusement Park Map</strong>. It shows the journey from one ride to another.</li>
                                <li>A <strong>Wireframe</strong> is the <strong>Floor Plan of a Single Ride</strong>. It shows where the entrance, queue, seats, and exit are.</li>
                            </ul>

                            <h5 class="font-semibold mt-6">Connecting Wireframes to UX</h5>
                            <p>Wireframing is a crucial UX (User Experience) tool because it helps us:</p>
                            <ul class="list-disc list-inside mt-2 space-y-2">
                                <li><strong>Focus on Usability:</strong> We can test our layout. Is the "Buy" button obvious? Is the user confused? We fix the layout before worrying about colors.</li>
                                <li><strong>Ensure the Flow Works:</strong> We compare our User Flow (flowchart) with our Wireframe (sketch) to make sure no steps are missed.</li>
                                <li><strong>Think About Structure:</strong> It forces us to think about clear headings and logical flow for everyone.</li>
                            </ul>

                            <h5 class="font-semibold mt-6">Rules for Lo-Fi Wireframes</h5>
                            <p>When making a Lo-Fi wireframe, we only care about layout. We ignore:</p>
                            <ul class="list-disc list-inside mt-2 space-y-1">
                                <li><strong>Colors:</strong> Everything is black, white, and gray.</li>
                                <li><strong>Fonts:</strong> Just write "Title" or "Paragraph".</li>
                                <li><strong>Real Images:</strong> Use a box with a cross (X) inside to mark "Image goes here".</li>
                                <li><strong>Beauty:</strong> Lo-Fi wireframes can look "ugly"! The goal is to get ideas down quickly.</li>
                            </ul>
                        `},
                        { id: 'jhs11-topic2', name: 'Activity 1: Paper Sketch', content: `
                            <h4>Design Challenge 1: Paper Sketch</h4>
                            <img src="https://cdn.prod.website-files.com/654ba60def05336c1f0eb138/6799483e826e17694ac815ed_1.jpg" alt="Low-Fidelity Wireframe Example" class="my-6">
                            <p>Now, let's connect last week's lesson with today's.</p>
                            <ol class="list-decimal list-inside mt-4 space-y-2">
                                <li><strong>Open Your Notes:</strong> Take out the User Flow flowchart you created in Meeting 10.</li>
                                <li><strong>Choose 1 Important Screen:</strong> Discuss with your group and pick ONE important screen from your flow. (e.g., "Enter Phone Number" screen for the "Buy Credit" group).</li>
                                <li><strong>Individual Task:</strong> On a piece of paper, individually sketch a Lo-Fi wireframe for the screen you chose.</li>
                                <li><strong>Focus:</strong> Remember the rules! Focus only on the LAYOUT. Where are the buttons? Where is the text input? Where do images go?</li>
                            </ol>
                            <p class="mt-4">After sketching, a few students will show their results to the class.</p>
                        `},
                        { id: 'jhs11-topic3', name: 'Intro to Figma', content: `
                            <h4>Introducing Our Tool: Figma</h4>
                            <img src="https://cdn.prod.website-files.com/66d825d3650f70aa06553ed3/6725f678a99d7a4570bd0826_Figma_Hero.gif" alt="Figma Design Tool Interface" class="my-6">
                            <p>Paper sketches are great for quick ideas. Now we'll move them to a digital tool so we can turn them into a Hi-Fi design next week.</p>
                            <p class="mt-4">Welcome to <strong>Figma</strong>! It's a professional design tool used worldwide (and it has a free version!).</p>
                            <h5 class="font-semibold mt-6">Quick Tour of the Figma Interface</h5>
                            <img src="https://help.figma.com/hc/article_attachments/24376974686999 " alt="Figma Interface Overview" class="my-6">
                            <p>The teacher will share their screen and give a brief tour, showing important tools:</p>
                            <ul class="list-disc list-inside mt-2 space-y-2">
                                <li><strong>Frame Tool (F):</strong> This is your "paper" or main canvas. We'll use it to select a phone screen size (e.g., iPhone 14).</li>
                                <li><strong>Shape Tools (R):</strong> For creating basic shapes. We'll use the Rectangle/Box (R) tool a lot for buttons, headers, and image placeholders (a box with an X).</li>
                                <li><strong>Text Tool (T):</strong> For writing text ("Title", "Paragraph", etc.).</li>
                            </ul>
                        `},
                        { id: 'jhs11-topic4', name: 'Activity 2: Digital Wireframe', content: `
                            <h4>Guided Practice: "RecipeApp" Digital Lo-Fi Wireframe</h4>
                            <img src="https://miro.medium.com/v2/resize:fit:1400/1*LBmgSNWIYPKY0UVetyqB1w.gif" alt="Figma Design Tool Interface" class="my-6">
                            <p>For our group practice in Figma, we'll use a new, uniform theme: a fictional app called "RecipeApp". We will create 2 Lo-Fi screens: the Home Page and the Recipe Detail Page.</p>
                            
                            <h5 class="font-semibold mt-6">Step 1: Create a Frame (Phone Screen)</h5>
                            <p>Press 'F' (Frame Tool). In the right panel, select "Phone" -> "iPhone 14". Name this frame "1. Home Lo-Fi".</p>

                            <h5 class="font-semibold mt-6">Step 2: Design the "Home Page" Wireframe</h5>
                            <ul class="list-decimal list-inside mt-2 space-y-2">
                                <li><strong>Bottom Navigation (Tab Bar):</strong> Draw a rectangle (R) at the bottom. Color it dark gray. Inside, create 3-4 simple icons (e.g., small squares for "Home", a circle for "Search").</li>
                                <li><strong>Title:</strong> Use the Text Tool (T) to write "Hello, Chef!". Make it bold.</li>
                                <li><strong>Recipe of the Day Card:</strong> Create a large rectangle (R) below the title for the main recipe image. Color it light gray and add an 'X' inside.</li>
                                <li><strong>Category Title:</strong> Add another text element: "Popular Recipes".</li>
                                <li><strong>Recipe List:</strong> Create several small "recipe cards": a small rectangle (for the image, with an 'X'), a bold text element next to it for "Recipe Name", and smaller text below for "Short description...". Group (Ctrl+G) and duplicate this card 2-3 times.</li>
                            </ul>

                            <h5 class="font-semibold mt-6">Step 3: Design the "Detail Page" Wireframe</h5>
                            <ul class="list-decimal list-inside mt-2 space-y-2">
                                <li><strong>Duplicate Frame:</strong> Copy and paste your "Home Lo-Fi" frame to create a second screen. Name it "2. Detail Lo-Fi".</li>
                                <li><strong>Clear Old Content:</strong> Delete everything from the second frame except the bottom navigation bar.</li>

                        { id: 'it11-13-intro', name: 'Introduction', content: `
                            <h4>Our Mission: Build a Dashboard with Flexbox</h4>
                            <p>In our last lesson, we learned the theory behind Flexbox properties like <code>display: flex</code>, <code>justify-content</code>, and <code>align-items</code>. Today, we're putting it all into practice by building a real-world component: a responsive dashboard layout.</p>
                            <p class="mt-4"><strong>This is our goal for today:</strong></p>
                            <img src="https://images2.imgbox.com/88/5c/PigZRoe2_o.jpeg" alt="Final dashboard layout we will build" class="my-6 rounded-lg shadow-md">
                            <p>We will build this step-by-step, using Flexbox to control:</p>
                            <ul class="list-disc list-inside mt-2 space-y-2">
                                <li>The main <strong>sidebar + content</strong> layout.</li>
                                <li>The <strong>horizontally scrolling</strong> "Popular Courses" section.</li>
                                <li>The layout of each item in the <strong>"My Courses"</strong> list.</li>
                            </ul>
                            <p class="mt-4">Let's get started!</p>
                        `},
                        { id: 'it11-13-step1', name: 'Step 1: Main Layout', content: `
                            <h4>Step 1: The Main Structure (Sidebar + Content)</h4>
                            <p>First, we'll create the largest structure: a container that holds our sidebar on the left and our main content area on the right.</p>
                            
                            <h5 class="font-semibold mt-6">HTML for the Main Layout</h5>
                            <p>In a new HTML file, let's add the basic structure. We have one parent <code>.dashboard-container</code> and two children: <code>.sidebar</code> and <code>.main-content</code>.</p>
                            <pre><code>&lt;body&gt;
    &lt;!-- 1. THE MAIN FLEX CONTAINER --&gt;
    &lt;div class="dashboard-container"&gt;

        &lt;!-- Flex Item 1: The Sidebar --&gt;
        &lt;nav class="sidebar"&gt;
            &lt;!-- Sidebar content will go here later --&gt;
        &lt;/nav&gt;

        &lt;!-- Flex Item 2: The Main Content Area --&gt;
        &lt;main class="main-content"&gt;
            &lt;!-- Main content will go here later --&gt;
        &lt;/main&gt;

    &lt;/div&gt;
&lt;/body&gt;</code></pre>

                            <h5 class="font-semibold mt-6">CSS for the Main Layout</h5>
                            <p>Now for the magic. We'll turn <code>.dashboard-container</code> into a flex container.</p>
                            <pre><code>/* Reset dasar & warna body */
body {
    font-family: Arial, sans-serif;
    margin: 0;
    background-color: lightgray; 
}

/* --- 1. FLEXBOX: MAIN LAYOUT --- */
.dashboard-container {
    display: flex;
}

.sidebar {
    /* We give the sidebar a fixed starting width */
    flex-basis: 240px; 
    /* We tell it NOT to shrink, even if the window is small */
    flex-shrink: 0; 
    
    background-color: white;
    height: 100vh; /* Make it full screen height */
}

.main-content {
    /* This is the key! It tells the content to "grow" and take up all remaining space. */
    flex-grow: 1;
    padding: 30px;
    height: 100vh;
    overflow-y: auto; /* If content is long, make it scrollable */
    box-sizing: border-box;
}</code></pre>
                            <p class="mt-4">With just this code, you already have a two-column layout that spans the full height of the screen!</p>
                        `},
                        { id: 'it11-13-step2', name: 'Step 2: The Sidebar', content: `
                            <h4>Step 2: Building the Sidebar's Content</h4>
                            <p>Now let's focus on what's <em>inside</em> the sidebar. We'll use Flexbox again here (a flex container inside a flex item!) to arrange the logo, menu, and promo card vertically.</p>

                            <h5 class="font-semibold mt-6">HTML for the Sidebar</h5>
                            <p>Fill in your <code>&lt;nav class="sidebar"&gt;</code> with this content.</p>
                            <pre><code>&lt;nav class="sidebar"&gt;
    &lt;div class="logo"&gt;Infinity&lt;/div&gt;
    &lt;ul&gt;
        &lt;li class="active"&gt;Dashboard&lt;/li&gt;
        &lt;li&gt;Profile&lt;/li&gt;
        &lt;li&gt;Courses&lt;/li&gt;
        &lt;li&gt;Message&lt;/li&gt;
        &lt;li&gt;Setting&lt;/li&gt;
    &lt;/ul&gt;
    &lt;div class="promo-card"&gt;
        &lt;p&gt;32 million learners&lt;/p&gt;
    &lt;/div&gt;
&lt;/nav&gt;</code></pre>

                            <h5 class="font-semibold mt-6">CSS for the Sidebar</h5>
                            <p>We'll add to our <code>.sidebar</code> rule and style its children.</p>
                            <pre><code>.sidebar {
    flex-basis: 240px;
    flex-shrink: 0;
    background-color: white;
    height: 100vh;
    padding: 20px;

    /* FLEXBOX: Arrange items INSIDE the sidebar */
    display: flex;
    flex-direction: column; /* Stack items vertically */
}

.sidebar .logo {
    font-weight: bold;
    font-size: 24px;
    padding-bottom: 30px;
}

.sidebar ul {
    list-style: none;
    padding: 0;
    margin: 0;

    flex-grow: 1; 
}

.sidebar li {
    padding: 15px 10px;
    border-radius: 8px;
}

.sidebar li.active {
    background-color: beige;
}

.sidebar .promo-card {
    background-color: ghostwhite;
    padding: 20px;

                        `},
                        { id: 'it11-13-step3', name: 'Step 3: Popular Courses', content: `
                            <h4>Step 3: The Horizontally Scrolling "Popular Courses"</h4>
                            <p>Next, we'll build the row of course cards that can be scrolled sideways if there are too many to fit.</p>

                            <h5 class="font-semibold mt-6">HTML for Popular Courses</h5>
                            <p>Inside your <code>&lt;main class="main-content"&gt;</code>, add this structure.</p>
                            <pre><code>&lt;main class="main-content"&gt;
    &lt;h2&gt;Popular courses&lt;/h2&gt;
    &lt;!-- 2. THE HORIZONTAL FLEX CONTAINER --&gt;
    &lt;div class="popular-courses-row"&gt;
        &lt;div class="course-card"&gt;
            &lt;h3&gt;Design Thinking&lt;/h3&gt;
            &lt;p&gt;Beginner's Guide&lt;/p&gt;
        &lt;/div&gt;
        &lt;div class="course-card"&gt;
            &lt;h3&gt;UX Designer&lt;/h3&gt;

        &lt;/div&gt;
        &lt;div class="course-card"&gt;
            &lt;h3&gt;Psychology&lt;/h3&gt;
            &lt;p&gt;Ultimate Guide&lt;/p&gt;
        &lt;/div&gt;
        &lt;div class="course-card"&gt;
            &lt;h3&gt;Swift UI&lt;/h3&gt;
            &lt;p&gt;Intro to iOS App&lt;/p&gt;
        &lt;/div&gt;
    &lt;/div&gt;
    &lt;!-- "My Courses" section will go here later --&gt;
&lt;/main&gt;</code></pre>

                            <h5 class="font-semibold mt-6">CSS for Popular Courses</h5>
                            <p>The key here is combining <code>display: flex</code> with <code>overflow-x: auto</code>.</p>
                            <pre><code>.popular-courses-row {
    display: flex;
    /* This is what enables horizontal scrolling! */
    overflow-x: auto;  
    padding-bottom: 20px; /* Space for the scrollbar */
}

.course-card {
    width: 220px;
    background-color: white;
    border-radius: 8px;
    padding: 15px;
    margin-right: 15px;
    
    /* Prevents cards from shrinking to fit */

}

.course-card h3 {
    margin-top: 0;
}</code></pre>
                        `},
                        { id: 'it11-13-step4', name: 'Step 4: My Courses List', content: `
                            <h4>Step 4: The "My Courses" List</h4>
                            <p>Finally, let's build the list of courses. This is another great example of nested Flexbox. The list itself is a vertical flex container, and each item inside it is a horizontal flex container.</p>

                            <h5 class="font-semibold mt-6">HTML for My Courses</h5>

                            <pre><code>&lt;!-- ... popular courses div ends here ... --&gt;

&lt;h2&gt;My courses&lt;/h2&gt;
&lt;!-- 3. THE VERTICAL FLEX CONTAINER --&gt;
&lt;div class="my-courses-list"&gt;
    
    &lt;!-- 4. A HORIZONTAL FLEX ITEM --&gt;
    &lt;div class="list-item"&gt;
        &lt;span&gt;Adobe Photoshop CC 2019&lt;/span&gt;
        &lt;a href="#"&gt;View Course&lt;/a&gt;
    &lt;/div&gt;
    &lt;div class="list-item"&gt;
        &lt;span&gt;Color Theory for Digital Artists&lt;/span&gt;

        &lt;a href="#"&gt;View Course&lt;/a&gt;

&lt;/div&gt;</code></pre>

                            <h5 class="font-semibold mt-6">CSS for My Courses</h5>
                            <p>Here we use <code>justify-content: space-between</code> to push the title and button to opposite ends.</p>
                            <pre><code>.my-courses-list {

                        `},

                'it10-9': {
                    title: 'IT-10 - Meeting 9',
                    subtitle: 'Introduction to CSS & Selectors',
                    tabs: [
                        { id: 'opening', name: 'Opening', content: openingTabContent },
                        { id: 'it10-9-warmup', name: 'Pemanasan', content: `
                            <h4>The Magic Behind Website Appearance</h4>
                            <p>Let's compare two web pages. Both have the exact same HTML content. One is pure HTML, and the other has CSS applied.</p>
                            <img src="https://media.geeksforgeeks.org/wp-content/uploads/20250606170311067516/Webpage-With---without-CSS.webp" alt="Webpage with and without CSS" class="my-6">
                            <p class="mt-4"><strong>Questions for the class:</strong></p>
                            <ul class="list-disc list-inside mt-2 space-y-2">
                                <li>"What is the most striking difference between Page A and Page B?"</li>
                                <li>"Which page do you think is more attractive and easier to read? Why?"</li>
                                <li>"What magic power is used on Page B to transform the plain look into something amazing?"</li>
                            </ul>
                            <p class="mt-4">This discussion will lead us to the conclusion that HTML only builds the structure (skeleton), while another "magic" is responsible for the style (clothes and makeup). That magic is called CSS.</p>
                        `},
                        { id: 'it10-9-topic1', name: 'What is CSS?', content: `
                            <h4>What is CSS? Skeleton vs. Outfit</h4>
                            <p>If HTML is the skeleton of a web page, then CSS (Cascading Style Sheets) is the clothing, paint color, and all the decorations that make it look attractive.</p>
                            <ul class="list-disc list-inside mt-4 space-y-2">
                                <li><strong>HTML (HyperText Markup Language):</strong> Defines what the content is (This is a heading, this is a paragraph, this is an image).</li>
                                <li><strong>CSS (Cascading Style Sheets):</strong> Defines how that content looks (This heading is blue, this paragraph uses the Arial font, this image has a border).</li>
                            </ul>
                            <img src="https://media.licdn.com/dms/image/v2/D4D12AQGKIiZFH6KrxA/article-cover_image-shrink_600_2000/article-cover_image-shrink_600_2000/0/1695989130052?e=2147483647&v=beta&t=dxoej1pzIiQAKOYglT_5k9nwJlvZlH6UkbigwbSMKqM" alt="HTML skeleton vs CSS clothing analogy" class="my-6">
                            <p class="mt-4">Without CSS, the entire internet would look boring and plain.</p>
                        `},
                        { id: 'it10-9-topic2', name: 'Inline CSS', content: `
                            <h4>The First Way - Inline CSS (Direct Style)</h4>
                            <p><strong>Analogy:</strong> Giving a unique accessory to a single element. For example, wearing a special watch with just one outfit.</p>
                            <p class="mt-2"><strong>How it works:</strong> Add the <code>style</code> attribute directly into the HTML tag you want to change.</p>
                            <p class="mt-4"><strong>Example:</strong></p>
                            <pre><code>&lt;h1 style="color: blue; font-size: 24px;"&gt;This Blue Title is Special&lt;/h1&gt;
&lt;p&gt;This paragraph is not affected at all.&lt;/p&gt;</code></pre>
                            <p class="mt-4"><strong>When to use it?</strong> Useful for small, quick changes or for testing. Not recommended for styling an entire page because it makes the HTML code messy and hard to manage.</p>
                        `},
                        { id: 'it10-9-topic3', name: 'Internal CSS', content: `
                            <h4>The Second Way - Internal CSS (Style Inside the Page)</h4>
                            <p><strong>Analogy:</strong> Setting a dress code for a special event (<code>&lt;style&gt;</code>) that applies to all guests on that page.</p>
                            <p class="mt-2"><strong>How it works:</strong> Write CSS code inside a <code>&lt;style&gt;</code> tag placed within the <code>&lt;head&gt;</code> of the HTML document. The rules here will apply to all matching elements on that page.</p>
                            <p class="mt-4"><strong>Example:</strong></p>
                            <pre><code>&lt;head&gt;
    &lt;title&gt;Page with Internal Style&lt;/title&gt;
    &lt;style&gt;
        h1 {
            color: green;
        }
        p {
            font-family: sans-serif;
        }
    &lt;/style&gt;
&lt;/head&gt;
&lt;body&gt;
    &lt;h1&gt;All H1s on this page will be green.&lt;/h1&gt;
    &lt;p&gt;And all paragraphs will use the sans-serif font.&lt;/p&gt;
    &lt;h1&gt;This title will also be green.&lt;/h1&gt;
&lt;/body&gt;</code></pre>
                            <p class="mt-4"><strong>When to use it?</strong> Useful if a single page has a very unique style that won't be used on other pages.</p>
                        `},
                        { id: 'it10-9-topic4', name: 'External CSS', content: `
                            <h4>The Third Way - External CSS (The Professional Way!)</h4>
                            <p><strong>Analogy:</strong> Having one large wardrobe (a <code>.css</code> file) whose rules can be followed by all pages (<code>.html</code> files) across the entire website. This is the cleanest and most efficient method.</p>
                            <p class="mt-2"><strong>How it works:</strong></p>
                            <ol class="list-decimal list-inside mt-2 space-y-1">
                               <li>We create a new file (e.g., <code>style.css</code>) and write all our CSS code there (without <code>&lt;style&gt;</code> tags).</li>
                               <li>We link it to our HTML file using the <code>&lt;link&gt;</code> tag inside the <code>&lt;head&gt;</code>.</li>
                            </ol>
                            <p class="mt-4"><strong>Example:</strong></p>
                            <p>File <code>style.css</code>:</p>
                            <pre><code>body {
    background-color: #f0f8ff; /* Alice Blue */
}
h1 {
    color: #4682b4; /* Steel Blue */
}</code></pre>
                            <p>File <code>index.html</code>:</p>
                            <pre><code>&lt;head&gt;
    &lt;title&gt;Page with External Style&lt;/title&gt;
    &lt;link rel="stylesheet" href="style.css"&gt;
&lt;/head&gt;
&lt;body&gt;
    &lt;h1&gt;This page gets its style from the style.css file&lt;/h1&gt;
&lt;/body&gt;</code></pre>
                            <p class="mt-4"><strong>When to use it?</strong> This is the best and most commonly used method. It keeps code clean, easy to manage, and ensures a consistent look across the entire website.</p>
                        `},
                        { id: 'it10-9-topic5', name: 'CSS Selectors', content: `
                            <h4>Becoming a Style Detective - Introduction to CSS Selectors</h4>
                            <p>To style an element, we must tell CSS which element to target. This process is called selecting, and the tool for it is a selector. The basic rule of CSS is always the same:</p>
                            <pre><code>selector { property: value; }</code></pre>
                            <img src="https://static.observableusercontent.com/files/8240b8b44c51e10c7baef0329a8837073774854c84505a8303cff20a589fa96709bfff22de4986c35ff635e2e9e0510d1f5f07cd1fcac0c72ffcd784d358046b" alt="CSS rule syntax diagram" class="my-6">
                            <p class="mt-4">We will learn the three most basic selectors.</p>
                        `},
                        { id: 'it10-9-topic6', name: 'Tag Selector', content: `
                            <h4>Selector #1 - The Tag Selector (Element Selector)</h4>
                            <p><strong>Function:</strong> Selects all elements of a specific tag type on the entire page.</p>
                            <p class="mt-2"><strong>How it works:</strong> Write the tag name directly as the selector.</p>
                            <p class="mt-4"><strong>Example:</strong></p>
                            <pre><code>/* File style.css */
p { 
    color: grey; 
    line-height: 1.5; /* Adds space between lines */
}</code></pre>
                            <p class="mt-4">The rule above will make all <code>&lt;p&gt;</code> tags on the page turn grey with more comfortable line spacing.</p>
                        `},
                        { id: 'it10-9-topic7', name: 'Class Selector', content: `
                            <h4>Selector #2 - The Class Selector</h4>
                            <p><strong>Function:</strong> Selects all elements that have the same <code>class</code> attribute. This is the most flexible and most frequently used selector.</p>
                            <p class="mt-2"><strong>Analogy:</strong> Giving a uniform or a label to a group of elements. You can give the same class name to many elements, even of different types.</p>
                            <p class="mt-2"><strong>How it works:</strong> Starts with a period (<code>.</code>) followed by the class name.</p>
                            <p class="mt-4"><strong>Example:</strong></p>
                            <p>HTML:</p>
                            <pre><code>&lt;p class="highlight"&gt;This text is important and needs to be highlighted.&lt;/p&gt;
&lt;div&gt;
    &lt;p&gt;Normal paragraph.&lt;/p&gt;
    &lt;span class="highlight"&gt;This part is also highlighted!&lt;/span&gt;
&lt;/div&gt;</code></pre>
                            <p>CSS:</p>
                            <pre><code>.highlight { 
    background-color: yellow;
    font-weight: bold;
}</code></pre>
                            <p class="mt-4">As a result, the first <code>&lt;p&gt;</code> and the <code>&lt;span&gt;</code> will have a yellow background and bold text.</p>
                        `},
                        { id: 'it10-9-topic8', name: 'ID Selector', content: `
                            <h4>Selector #3 - The ID Selector</h4>
                            <p><strong>Function:</strong> Selects one unique element that has a specific <code>id</code> attribute.</p>
                            <p class="mt-2"><strong>Analogy:</strong> Calling a specific element by its national ID number. An ID must be unique; there cannot be duplicates on the same page.</p>
                            <p class="mt-2"><strong>How it works:</strong> Starts with a hash sign (<code>#</code>) followed by the ID name.</p>
                            <p class="mt-4"><strong>Example:</strong></p>
                            <p>HTML:</p>
                            <pre><code>&lt;div id="main-menu"&gt;
    &lt;!-- Navigation content goes here --&gt;
&lt;/div&gt;
&lt;div id="page-footer"&gt;
    &lt;!-- Footer content goes here --&gt;
&lt;/div&gt;</code></pre>
                            <p>CSS:</p>
                            <pre><code>#main-menu { 
    border-bottom: 2px solid navy; 
}
#page-footer {
    background-color: #333;
    color: white;
}</code></pre>
                            <p class="mt-4">This style will only apply to the element with that specific ID.</p>
                        `},
                        { id: 'it10-9-topic9', name: 'Aktivitas', content: `
                            <h4>Main Activity: Styling Practice</h4>
                            <p>Now it's your turn to transform your "Personal Profile" page from plain to stylish!</p>
                            <p class="mt-4"><strong>Your Task:</strong></p>
                            <ol class="list-decimal list-inside mt-2 space-y-2">
                                <li>Open your <code>profil.html</code> project in Replit.</li>
                                <li><strong>Create CSS File:</strong> Create a new file in your project and name it <code>style.css</code>.</li>
                                <li><strong>Link the File:</strong> Inside your <code>profil.html</code> file, add a <code>&lt;link&gt;</code> tag within the <code>&lt;head&gt;</code> to connect <code>style.css</code>.
                                    <pre><code>&lt;link rel="stylesheet" href="style.css"&gt;</code></pre>
                                </li>
                                <li>Open <code>style.css</code> and add the following style rules:
                                    <ul class="list-disc list-inside ml-4 mt-2 space-y-1">
                                        <li>Use the Tag Selector to give the entire <code>&lt;body&gt;</code> a <code>background-color</code>. Choose a light color you like (e.g., <code>lightblue</code>, <code>#f5f5f5</code>, <code>ivory</code>).</li>
                                        <li>Use the Tag Selector to change the <code>color</code> and <code>font-family</code> of the <code>&lt;h1&gt;</code> (your name).</li>
                                        <li>Use the Tag Selector to make all <code>&lt;h2&gt;</code> elements the same color.</li>
                                        <li><strong>Class Challenge:</strong> Give one of the <code>&lt;li&gt;</code> items in your hobbies list a <code>class="favorite-hobby"</code>. Then, in your CSS, use the Class Selector (<code>.favorite-hobby</code>) to make it bold (<code>font-weight: bold;</code>).</li>
                                        <li><strong>ID Challenge:</strong> Give your <code>&lt;img&gt;</code> tag an <code>id="profile-picture"</code>. Then, in your CSS, use the ID Selector (<code>#profile-picture</code>) to give it a border (<code>border: 5px solid steelblue;</code>).</li>
                                    </ul>
                                </li>
                            </ol>
                        `},
                        { id: 'it10-9-topic10', name: 'Refleksi', content: `
                            <h4>Closing Reflection: Showcase and Share!</h4>

                            <blockquote class="mt-2 border-l-4 pl-4 italic">"Which selector (Tag, Class, or ID) did you find most useful when styling your profile page today? Explain why!"</blockquote>

                'it10-10': {
                    title: 'IT-10 - Meeting 10',
                    subtitle: 'Styling Text with CSS (Fonts & Text Properties)',
                    tabs: [
                        { id: 'opening', name: 'Opening', content: openingTabContent },
                        { id: 'it10-10-warmup', name: 'Warm-Up', content: `
                            <h4>Why Typography Matters</h4>
                            <p>Let's look at two examples. Both have the exact same words. One is difficult to read, and one is easy to read.</p>
                            <img src="https://uploads.sitepoint.com/wp-content/uploads/2014/02/1392969773BodyFonts.png" alt="Example of good vs bad typography" class="my-6">
                            <p class="mt-4"><strong>Questions for the class:</strong></p>
                            <ul class="list-disc list-inside mt-2 space-y-2">
                                <li>"Which example would you rather read an entire article from? Why?"</li>
                                <li>"What makes the text in the difficult example so hard to read?"</li>
                                <li>"Besides color, what are some ways we can change how text looks on a page?"</li>
                            </ul>
                            <p class="mt-4">This discussion introduces the concept of typography: the art of arranging text to make it legible, readable, and appealing when displayed. In web design, good typography is crucial. If users can't easily read your content, they will leave your site.</p>
                        `},
                        { id: 'it10-10-topic1', name: 'Core Properties', content: `
                            <h4>The Four Core Text Properties</h4>
                            <img src="https://www.htmldog.com/figures/weightStyle.gif" alt="CSS text properties example" class="my-6">
                            <p>Today, we will learn how to control the most important aspects of web typography using four fundamental CSS properties:</p>
                            <ul class="list-disc list-inside mt-4 space-y-2">
                                <li><strong>font-family:</strong> The style or design of the text (e.g., Arial, Times New Roman).</li>
                                <li><strong>font-size:</strong> How large or small the text is.</li>
                                <li><strong>font-weight:</strong> The thickness of the text (e.g., normal or bold).</li>
                                <li><strong>text-align:</strong> The horizontal alignment of the text (e.g., left, center, or right).</li>
                            </ul>
                            <p class="mt-4">Mastering these four properties will give you enormous power to improve the design of your websites.</p>
                        `},
                        { id: 'it10-10-topic2', name: 'font-family', content: `
                            <h4>font-family - Giving Text a Personality</h4>
                            <p>The <code>font-family</code> property lets you choose the font for your text. There are two main categories of fonts:</p>
                            <ul class="list-disc list-inside mt-2 space-y-2">
                                <li><strong>Serif:</strong> Fonts with small decorative strokes (serifs) at the ends of letters. They often feel classic or formal. (e.g., Times New Roman, Georgia).</li>
                                <li><strong>Sans-serif:</strong> Fonts without those strokes. They often feel modern and clean. (e.g., Arial, Helvetica, Verdana).</li>
                            </ul>
                            <h5 class="font-semibold mt-6">How to Use It (with Fallbacks)</h5>
                            <p>It's best practice to provide a list of fonts, separated by commas. The browser will try the first font, and if the user doesn't have it installed, it will "fall back" to the next one in the list.</p>
                            <pre><code>p {
  /* The browser will try to use "Roboto". If not available, it will try "Arial", then any available sans-serif font. */
  font-family: "Roboto", Arial, sans-serif;
}

h1 {
  font-family: Georgia, "Times New Roman", serif;
}</code></pre>
                        `},
                        { id: 'it10-10-topic3', name: 'font-size & weight', content: `
                            <h4>font-size & font-weight - Controlling Emphasis</h4>
                            <h5 class="font-semibold mt-6">font-size - How Big is Your Text?</h5>
                            <p>This property controls the size of the font. For now, the easiest unit to use is pixels (<code>px</code>).</p>
                            <pre><code>body {
  font-size: 16px; /* A good standard base size for paragraphs */
}

h1 {
  font-size: 32px; /* Headings should be significantly larger */
}</code></pre>
                            <h5 class="font-semibold mt-6">font-weight - How Thick is Your Text?</h5>
                            <p>This property controls the boldness of the text. You can use keywords or numbers.</p>
                            <ul class="list-disc list-inside mt-2 space-y-1">
                                <li><code>normal</code> (the default)</li>
                                <li><code>bold</code></li>
                                <li>Numeric values (e.g., <code>400</code> is normal, <code>700</code> is bold).</li>
                            </ul>
                            <pre><code>.highlight {
  font-weight: bold; /* or font-weight: 700; */
}</code></pre>
                        `},
                        { id: 'it10-10-topic4', name: 'text-align', content: `
                            <h4>text-align - Arranging Your Text</h4>
                            <p>This property controls the horizontal alignment of text within its container.</p>
                            <ul class="list-disc list-inside mt-2 space-y-1">
                                <li><code>left</code>: Aligns text to the left (default for most languages).</li>
                                <li><code>right</code>: Aligns text to the right.</li>
                                <li><code>center</code>: Centers the text.</li>
                            </ul>
                            <pre><code>h1 {
  text-align: center;
}

.caption {
  text-align: right;
}</code></pre>
                        `},
                        { id: 'it10-10-topic5', name: 'Google Fonts', content: `
                            <h4>Supercharge Your Fonts with Google Fonts</h4>
                            <p>While you can use basic system fonts, the web is full of beautiful, free fonts you can use. Google Fonts is the most popular resource for this.</p>
                            <h5 class="font-semibold mt-6">How to Use Google Fonts (in 3 Steps)</h5>
                            <ol class="list-decimal list-inside mt-2 space-y-2">
                                <li><strong>Choose a Font:</strong> Go to <a href="https://fonts.google.com" target="_blank">fonts.google.com</a>. Browse and find a font you like (e.g., "Lato" or "Montserrat"). Click on the font, select the styles you want (e.g., Regular 400 and Bold 700), and click "Get embed code".</li>
                                <li><strong>Link the Font in Your HTML:</strong> Google will give you a <code>&lt;link&gt;</code> tag. Copy this code and paste it inside the <code>&lt;head&gt;</code> of your index.html file, above your own stylesheet link.
                                <pre><code>&lt;head&gt;
  &lt;!-- Google Fonts Link (goes first) --&gt;
  &lt;link rel="preconnect" href="https://fonts.googleapis.com"&gt;
  &lt;link rel="preconnect" href="https://fonts.gstatic.com" crossorigin&gt;
  &lt;link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&display=swap" rel="stylesheet"&gt;
  
  &lt;!-- Your Stylesheet Link (goes second) --&gt;
  &lt;link rel="stylesheet" href="style.css"&gt;
&lt;/head&gt;</code></pre>
                                </li>
                                <li><strong>Use the Font in Your CSS:</strong> Google will also tell you the exact CSS <code>font-family</code> rule to use. Now you can apply it in your <code>style.css</code> file.
                                <pre><code>body {
  font-family: "Lato", sans-serif; /* Use the new font! */
}</code></pre>
                                </li>
                            </ol>
                            <p class="mt-4">And just like that, you have imported a custom font from the web!</p>
                        `},
                        { id: 'it10-10-topic6', name: 'Aktivitas', content: `
                            <h4>Main Activity: Typography Practice</h4>
                            <p>Now it's your turn to become a typographer! Open your "Personal Profile" project and make the text beautiful.</p>
                            <p class="mt-4"><strong>Your Task (in style.css):</strong></p>
                            <ol class="list-decimal list-inside mt-2 space-y-2">
                                <li><strong>Find a Google Font:</strong> Go to Google Fonts and choose a clean, readable font for your body text (e.g., Lato, Open Sans, Roboto) and a more stylish font for your headings (e.g., Oswald, Lobster, Playfair Display).</li>
                                <li><strong>Import Your Fonts:</strong> Add the <code>&lt;link&gt;</code> tags from Google Fonts to your <code>index.html</code> file's <code>&lt;head&gt;</code>.</li>
                                <li><strong>Style the Body:</strong> In <code>style.css</code>, target the <code>body</code> element and set its <code>font-family</code> to your chosen body font. Also, set a base <code>font-size</code> (like 17px).</li>
                                <li><strong>Style the Main Heading (&lt;h1&gt;):</strong>
                                    <ul class="list-disc list-inside ml-4 mt-2 space-y-1">
                                        <li>Set its <code>font-family</code> to your chosen heading font.</li>
                                        <li>Increase the <code>font-size</code> to make it stand out (e.g., 40px).</li>
                                        <li>Use <code>text-align</code> to center your name.</li>
                                    </ul>
                                </li>
                                <li><strong>Style the Subheadings (&lt;h2&gt;):</strong>
                                    <ul class="list-disc list-inside ml-4 mt-2 space-y-1">
                                        <li>Set their <code>font-family</code> to your heading font as well.</li>
                                        <li>Adjust their <code>font-size</code> to be smaller than the <code>&lt;h1&gt;</code> but larger than the paragraph text.</li>
                                    </ul>
                                </li>
                                <li><strong>Style the Paragraphs (&lt;p&gt;):</strong>
                                    <ul class="list-disc list-inside ml-4 mt-2 space-y-1">
                                        <li>Set a <code>line-height: 1.6;</code> to give the lines of text some breathing room and make them easier to read.</li>
                                    </ul>
                                </li>
                                <li><strong>Challenge:</strong> Find a specific piece of text on your page (like a quote or a special fact) and give it a unique class. Use that class to change its <code>font-weight</code> to <code>bold</code> and make its <code>font-style: italic;</code>.</li>
                            </ol>
                        `},
                        { id: 'it10-10-topic7', name: 'Refleksi', content: `

                'it10-11': {
                    title: 'IT-10 - Meeting 11',
                    subtitle: 'CSS Layouting: Flexbox',
                    tabs: [
                        { id: 'opening', name: 'Opening', content: openingTabContent },
                        { id: 'it11-9-warmup', name: 'Warm-Up', content: `
                            <h4>The Classic Layout Problem</h4>
                            <p>Imagine you are tasked with creating a layout like this using only the HTML and CSS properties we've learned so far (like margin and padding):</p>
                            <img src="https://i.sstatic.net/n1csD.png" alt="Three boxes in a row" class="my-6 bg-white p-4">
                            <p class="mt-4"><strong>Questions for the class:</strong></p>
                            <ul class="list-disc list-inside mt-2 space-y-2">
                                <li>"How would we make these three boxes line up neatly horizontally?"</li>
                                <li>"How could we ensure the space between them is exactly the same, even when the screen size changes?"</li>
                            </ul>
                            <p class="mt-4">You'll find that this is very difficult to do the old way. That's why developers created more powerful tools for layout. One of the most popular and powerful is <strong>Flexbox</strong>.</p>
                            <div class="mt-6 p-4 bg-green-50 border border-green-200 rounded-lg">
                                <p><strong>Interactive Game Recommendation:</strong><br>A very fun way to learn Flexbox is by playing a game. Try this in your free time: <a href="https://flexboxfroggy.com/" target="_blank">Flexbox Froggy</a>. It's the best way to train your Flexbox logic!</p>
                            </div>
                        `},
                        { id: 'it11-9-topic1', name: 'What is Flexbox?', content: `
                            <h4>What is Flexbox?</h4>
                            <p>Flexbox (or the Flexible Box Layout) is a CSS layout model designed to arrange elements in a single dimension, either as a row or a column.</p>
                            <p class="mt-4">Imagine you have several books. With Flexbox, you can easily:</p>
                            <ul class="list-disc list-inside mt-2 space-y-2">
                                <li>Line up the books in a single row.</li>
                                <li>Align all the books to the center.</li>
                                <li>Give equal spacing between each book.</li>
                                <li>Make them automatically adapt if the width of the bookshelf changes.</li>
                            </ul>
                            <p class="mt-4">To use Flexbox, you must understand two main components:</p>
                            <img src="https://www.programiz.com/sites/tutorial2program/files/css-flex-container-example.png" alt="Flex Container and Flex Items" class="my-6">
                            <ul class="list-disc list-inside mt-2 space-y-2">
                                <li><strong>Flex Container:</strong> This is the parent element that we give the property <code>display: flex;</code>.</li>
                                <li><strong>Flex Items:</strong> These are the child elements inside the flex container.</li>
                            </ul>
                            <pre><code>&lt;!-- Flex Container --&gt;
&lt;div class="container"&gt;
  &lt;!-- Flex Items --&gt;
  &lt;div class="item"&gt;1&lt;/div&gt;
  &lt;div class="item"&gt;2&lt;/div&gt;
  &lt;div class="item"&gt;3&lt;/div&gt;
&lt;/div&gt;</code></pre>
                        `},
                        { id: 'it11-9-topic2', name: 'Main & Cross Axis', content: `
                            <h4>Core Concept - Main Axis & Cross Axis</h4>
                            <p>Unlike regular layout, Flexbox works based on two axes whose directions can change.</p>
                            <img src="https://s3-ap-south-1.amazonaws.com/trt-blog-ghost/2020/03/65.png" alt="Flexbox Main and Cross Axis" class="my-6">
                            <ul class="list-disc list-inside mt-2 space-y-2">
                                <li><strong>Main Axis:</strong> This is the primary direction in which flex items are arranged. By default, its direction is horizontal (left to right).</li>
                                <li><strong>Cross Axis:</strong> This is the axis perpendicular to the main axis. By default, its direction is vertical (top to bottom).</li>
                            </ul>
                            <p class="mt-4">Understanding these two axes is crucial, as Flexbox properties work relative to them.</p>
                        `},
                        { id: 'it11-9-topic3', name: 'Container Properties', content: `
                            <h4>Key Properties on the Flex Container</h4>
                            <p>The following properties are applied to the parent element (the flex container).</p>
                            <h5 class="font-semibold mt-6">display: flex;</h5>
                            <p>This is the magic switch that activates Flexbox. Once you apply it to a container, all its direct children become flex items and automatically try to line up.</p>
                            <pre><code>.container {
  display: flex;
}</code></pre>
                            <h5 class="font-semibold mt-6">flex-direction</h5>
                            <p>This property determines the direction of the Main Axis.</p>
                            <ul class="list-disc list-inside mt-2">
                                <li><code>row</code> (default): Items line up from left to right.</li>
                                <li><code>row-reverse</code>: Items line up from right to left.</li>
                                <li><code>column</code>: Items line up from top to bottom.</li>
                                <li><code>column-reverse</code>: Items line up from bottom to top.</li>
                            </ul>
                            <h5 class="font-semibold mt-6">justify-content</h5>
                            <p>This property arranges how flex items are distributed along the <strong>Main Axis</strong>.</p>
                            <img src="https://media2.dev.to/dynamic/image/width=800%2Cheight=%2Cfit=scale-down%2Cgravity=auto%2Cformat=auto/https%3A%2F%2Fdev-to-uploads.s3.amazonaws.com%2Fuploads%2Farticles%2Fs7yhmbfp59ml4q3trh09.jpg" alt="justify-content options" class="my-6">
                            <h5 class="font-semibold mt-6">align-items</h5>
                            <p>This property arranges how flex items are aligned along the <strong>Cross Axis</strong>.</p>
                            <img src="https://images.thoughtbot.com/cp-design-for-the-web/SOtxyVsFR5uFGQAps9wW_layout-align-content.png" alt="align-items options" class="my-6">
                        `},
                        { id: 'it11-9-topic4', name: 'Main Activity', content: `
                            <h4>Main Activity: Hands-on Practice</h4>
                            <p>It's time to apply the power of Flexbox to your portfolio page! You will create two common components: a navigation bar and a card gallery.</p>
                            <h5 class="font-semibold mt-6">Task 1: Create a Horizontal Navigation Bar</h5>
                            <p>In your <code>index.html</code>, structure your navigation inside the <code>&lt;header&gt;</code> like this:</p>
                            <pre><code>&lt;nav&gt;
  &lt;a href="#home"&gt;Home&lt;/a&gt;
  &lt;a href="#about"&gt;About&lt;/a&gt;
  &lt;a href="#portfolio"&gt;Portfolio&lt;/a&gt;
  &lt;a href="#contact"&gt;Contact&lt;/a&gt;
&lt;/nav&gt;</code></pre>
                            <p class="mt-4">In your <code>style.css</code> file, target the <code>&lt;nav&gt;</code> element:</p>
                            <pre><code>nav {
  display: flex;
  justify-content: center; /* or flex-end, or space-around */
  background-color: #333;
  padding: 15px;
}
nav a {
  color: white;
  text-decoration: none;
  margin: 0 15px; /* Adds space between links */
}</code></pre>
                            <h5 class="font-semibold mt-6">Task 2: Create a Section with Aligned Cards</h5>
                            <p>In <code>index.html</code>, create a new <code>&lt;section&gt;</code> for your portfolio:</p>
                            <pre><code>&lt;section class="portfolio"&gt;
  &lt;div class="card"&gt;Project 1&lt;/div&gt;
  &lt;div class="card"&gt;Project 2&lt;/div&gt;
  &lt;div class="card"&gt;Project 3&lt;/div&gt;
&lt;/section&gt;</code></pre>
                            <p class="mt-4">In <code>style.css</code>, target the <code>.portfolio</code> and <code>.card</code> classes:</p>
                            <pre><code>.portfolio {
  display: flex;
  justify-content: space-around; /* To have space around the cards */
}

.card {
  width: 200px;
  height: 150px;
  background-color: lightgray;
  border: 1px solid #ccc;
  padding: 10px;
  text-align: center;
}</code></pre>
                            <p class="mt-4">Experiment by changing the <code>justify-content</code> value on <code>.portfolio</code> to see the different effects!</p>
                        `},
                        { id: 'it11-9-topic5', name: 'Reflection', content: `
                            <h4>Push & Reflect</h4>
                            <p>Save all your changes in VS Code. Use the terminal to commit and push your new layout to your GitHub repository.</p>
                            <pre><code>git add .
git commit -m "feat: Add Flexbox layout for navigation and portfolio"
git push</code></pre>
                            <h5 class="font-semibold mt-6">Answer in README.md</h5>
                            <p>Open the <code>README.md</code> file in your repository and add a new section to answer this question:</p>
                            <blockquote class="mt-2 border-l-4 pl-4 italic">"In which part of your page did Flexbox prove most useful? Why?"</blockquote>
                        `},

                'it10-12': {
                    title: 'IT-10 - Meeting 12',
                    subtitle: 'Mastering Flexbox Layout',
                    tabs: [
                        { id: 'opening', name: 'Opening', content: openingTabContent },
                        { id: 'it11-10-warmup', name: 'Warm-Up', content: `
                            <h4>Review: The Flexbox Foundation</h4>
                            <p>In our last session, we learned the magic command that starts it all: <code>display: flex;</code>. We turned a parent element (the <strong>Flex Container</strong>) into a flexible layout manager for its children (the <strong>Flex Items</strong>).</p>
                            <p class="mt-4">We also learned about <code>flex-direction</code>, which sets the main axis (either <code>row</code> or <code>column</code>).</p>
                            <p class="mt-4"><strong>Quick Question:</strong> "If you have three divs inside a container and you apply <code>display: flex;</code> to the container, what happens to the divs by default?"</p>
                            <p class="mt-2 text-gray-600">(Answer: They will line up horizontally in a row.)</p>
                            <p class="mt-4">Today, we're going to master how to align and distribute those items with precision using more container properties, and then we'll learn how to control the items themselves!</p>
                        `},
                        { id: 'it11-10-flex-direction', name: 'flex-direction', content: `
                            <h4>flex-direction: Setting the Main Axis</h4>
                            <p>This property establishes the <strong>main-axis</strong>, which defines the direction flex items are placed in the flex container. Think of flex items as primarily laying out either in horizontal rows or vertical columns.</p>
                            <img src="https://css-tricks.com/wp-content/uploads/2018/10/flex-direction.svg" alt="The four possible values of flex-direction" class="my-6 bg-white p-4 rounded-lg shadow-md">
                            <ul class="list-disc list-inside mt-4 space-y-3">
                                <li><code><strong>row</strong></code> (default): Items are placed from left to right.</li>
                                <li><code><strong>row-reverse</strong></code>: Items are placed from right to left.</li>
                                <li><code><strong>column</strong></code>: Items are placed from top to bottom.</li>
                                <li><code><strong>column-reverse</strong></code>: Items are placed from bottom to top.</li>
                            </ul>
                            <h5 class="font-semibold mt-6">Code Example:</h5>
                            <p>See what happens when you change the <code>flex-direction</code> from <code>row</code> to <code>column</code>.</p>
                            <pre><code class="language-html">&lt;!-- HTML Structure --&gt;
&lt;div class="flex-container direction-example"&gt;
  &lt;div class="item"&gt;1&lt;/div&gt;
  &lt;div class="item"&gt;2&lt;/div&gt;
  &lt;div class="item"&gt;3&lt;/div&gt;
&lt;/div&gt;

&lt;!-- CSS Styling --&gt;
&lt;style&gt;
  .direction-example {
    display: flex;
    background-color: #e9ecef;
    border: 1px solid #dee2e6;
    
    /* --- TRY CHANGING THIS VALUE! --- */
    /* Options: row, row-reverse, column, column-reverse */
    flex-direction: row;
  }
  .direction-example .item {
    background-color: #F7B32B;
    padding: 1rem;
    margin: 0.5rem;
    color: #333745;
    font-weight: bold;
  }
&lt;/style&gt;</code></pre>
                        `},
                        { id: 'it11-10-flex-wrap', name: 'flex-wrap', content: `
                            <h4>flex-wrap: To Wrap or Not to Wrap</h4>
                            <p>By default, flex items will all try to shrink and fit onto one line, even if it makes them look squished. The <code>flex-wrap</code> property allows you to change that and let the items wrap onto multiple lines as needed.</p>
                            <img src="https://css-tricks.com/wp-content/uploads/2018/10/flex-wrap.svg" alt="Diagram showing flex items wrapping to a new line" class="my-6 bg-white p-4 rounded-lg shadow-md">
                            <ul class="list-disc list-inside mt-4 space-y-3">
                                <li><code><strong>nowrap</strong></code> (default): All flex items will be on one line.</li>
                                <li><code><strong>wrap</strong></code>: Flex items will wrap onto multiple lines, from top to bottom.</li>
                                <li><code><strong>wrap-reverse</strong></code>: Flex items will wrap onto multiple lines from bottom to top.</li>
                            </ul>
                            <h5 class="font-semibold mt-6">Code Example:</h5>
                            <p>Here we have many items in a container. See the difference between <code>nowrap</code> (squished) and <code>wrap</code> (organized).</p>
                            <pre><code class="language-html">&lt;!-- HTML Structure --&gt;
&lt;div class="flex-container wrap-example"&gt;
  &lt;div class="item"&gt;1&lt;/div&gt; &lt;div class="item"&gt;2&lt;/div&gt; &lt;div class="item"&gt;3&lt;/div&gt;
  &lt;div class="item"&gt;4&lt;/div&gt; &lt;div class="item"&gt;5&lt;/div&gt; &lt;div class="item"&gt;6&lt;/div&gt;
  &lt;div class="item"&gt;7&lt;/div&gt; &lt;div class="item"&gt;8&lt;/div&gt;
&lt;/div&gt;

&lt;!-- CSS Styling --&gt;
&lt;style&gt;
  .wrap-example {
    display: flex;
    border: 1px solid #dee2e6;
    
    /* --- TRY CHANGING THIS VALUE! --- */
    /* Options: nowrap, wrap */
    flex-wrap: wrap;
  }
  .wrap-example .item {
    background-color: #2596BE; /* Primary Blue */
    color: white;
    padding: 1rem;
    margin: 0.5rem;
    width: 150px; /* Give items a fixed width */
  }
&lt;/style&gt;</code></pre>
                        `},
                        { id: 'it11-10-topic1', name: 'justify-content', content: `
                            <h4>justify-content: Spacing Out Your Toys</h4>
                            <p>Imagine you have a big toy box (your flex container) and a few action figures (your flex items). The <code>justify-content</code> property is like telling your action figures how to line up inside the box from left to right.</p>
                            <p class="mt-4">This property is all about controlling the alignment and spacing of items along the <strong>main axis</strong> (the horizontal line, by default). It's what you use when you have extra empty space in your container and you want to decide what to do with it.</p>
                            <img src="https://css-tricks.com/wp-content/uploads/2018/10/justify-content.svg" alt="Visual examples of justify-content values" class="my-6 bg-white p-4 rounded-lg shadow-md">
                            <ul class="list-disc list-inside mt-4 space-y-3">
                                <li><code><strong>flex-start</strong></code> (default): All your action figures are huddled together at the <strong>start</strong> (left side) of the toy box.</li>
                                <li><code><strong>flex-end</strong></code>: All your action figures are huddled together at the <strong>end</strong> (right side) of the toy box.</li>
                                <li><code><strong>center</strong></code>: All your action figures are grouped together right in the <strong>center</strong> of the toy box.</li>
                                <li><code><strong>space-between</strong></code>: This is a popular one! The first action figure touches the left side, the last one touches the right side, and all the extra space is shared evenly <strong>between</strong> them. There's no space at the ends.</li>
                                <li><code><strong>space-around</strong></code>: Each action figure gets an equal amount of personal space <strong>around</strong> it. This means the space at the very ends of the box is half the size of the space between the figures (because the end figures only have space on one side, while the middle ones have space on both sides).</li>
                                <li><code><strong>space-evenly</strong></code>: This is the fairest of all! The space between every action figure, and the space from the figures to the edges of the box, is exactly the same. All gaps are <strong>even</strong>.</li>
                            </ul>
                            <h5 class="font-semibold mt-6">Code Example:</h5>
                            <p>Try changing the value of <code>justify-content</code> in this example to see how the boxes move!</p>
                            <pre><code class="language-html">&lt;!-- HTML Structure --&gt;
&lt;div class="flex-container justify-example"&gt;
  &lt;div class="item"&gt;1&lt;/div&gt;
  &lt;div class="item"&gt;2&lt;/div&gt;
  &lt;div class="item"&gt;3&lt;/div&gt;
&lt;/div&gt;

&lt;!-- CSS Styling --&gt;
&lt;style&gt;
  .justify-example {
    display: flex;
    background-color: #e9ecef;
    border: 1px solid #dee2e6;
    
    /* --- TRY CHANGING THIS VALUE! --- */
    /* Options: flex-start, center, space-between, space-around, space-evenly */
    justify-content: space-between;
  }
  .justify-example .item {
    width: 60px;
    height: 60px;
    background-color: #F7B32B;
    color: #333745;
    font-weight: bold;
    display: flex;
    align-items: center;
    justify-content: center;
  }
&lt;/style&gt;</code></pre>
                        `},
                        { id: 'it11-10-topic2', name: 'align-items', content: `
                            <h4>Aligning on the Cross Axis: <code>align-items</code></h4>
                            <p>While <code>justify-content</code> works on the main axis, <code>align-items</code> defines how flex items are aligned along the <strong>cross axis</strong>.</p>
                            <p class="mt-2">If our main axis is a row (horizontal), then the cross axis is vertical.</p>
                            <img src="https://css-tricks.com/wp-content/uploads/2018/10/align-items.svg" alt="Visual examples of align-items values" class="my-6 bg-white p-4 rounded-lg shadow-md">
                            <ul class="list-disc list-inside mt-4 space-y-3">
                                <li><code><strong>stretch</strong></code> (default): Items stretch to fill the container's height (or width if <code>flex-direction</code> is column).</li>
                                <li><code><strong>flex-start</strong></code>: Items are aligned to the start of the cross axis (top).</li>
                                <li><code><strong>flex-end</strong></code>: Items are aligned to the end of the cross axis (bottom).</li>
                                <li><code><strong>center</strong></code>: Items are centered on the cross axis (vertically centered).</li>
                            </ul>
                            <h5 class="font-semibold mt-6">Code Example:</h5>
                            <p>Let's see it in action. A container must have a defined height for <code>align-items</code> to have a visible effect (unless using <code>stretch</code> on items without a set height).</p>
                            <pre><code class="language-html">&lt;!-- HTML Structure --&gt;
&lt;div class="flex-container align-example"&gt;
  &lt;div class="item"&gt;1&lt;/div&gt;
  &lt;div class="item tall"&gt;2&lt;/div&gt;
  &lt;div class="item"&gt;3&lt;/div&gt;
&lt;/div&gt;

&lt;!-- CSS Styling --&gt;
&lt;style&gt;
  .align-example {
    display: flex;
    height: 200px; /* Height is needed to see vertical alignment */
    background-color: #e9ecef;
    border: 1px solid #dee2e6;
    
    /* --- TRY CHANGING THIS VALUE! --- */
    /* Options: flex-start, flex-end, center, stretch */
    align-items: center;
  }
  .align-example .item {
    background-color: #F7B32B;
    padding: 1rem;
    margin: 0.5rem;
    color: #333745;
    font-weight: bold;
  }
&lt;/style&gt;</code></pre>
                        `},
                        { id: 'it11-10-flex-grow', name: 'flex-grow', content: `
                            <h4>flex-grow: The "Greedy" Property</h4>
                            <p>So far, we've only applied properties to the container. But we can also give special instructions to individual flex items! The <code>flex-grow</code> property is the first of these.</p>
                            <p class="mt-4">This property defines an item's ability to "grow" and take up any available free space inside the flex container. Think of it as a "greediness" level.</p>
                            <img src="https://css-tricks.com/wp-content/uploads/2018/10/flex-grow.svg" alt="Diagram showing how flex-grow distributes space" class="my-6 bg-white p-4 rounded-lg shadow-md">
                            <h5 class="font-semibold mt-6">How it Works:</h5>
                            <p>The <code>flex-grow</code> property accepts a single, unitless number that acts as a proportion. The default value is <code>0</code>, which means items will not grow at all.</p>
                            <ul class="list-disc list-inside mt-4 space-y-3">
                                <li>If all items have <code>flex-grow: 1;</code>, the leftover space in the container will be distributed equally among all of them.</li>
                                <li>If one item has <code>flex-grow: 2;</code> and the others have <code>flex-grow: 1;</code>, the "greedy" item will try to take up twice as much of the available space as the others.</li>
                            </ul>
                            <p class="mt-4"><strong>Analogy: Sharing a Pizza 🍕</strong><br>Imagine three friends and one leftover pizza slice (the "available space").</p>
                            <ul class="list-disc list-inside mt-2 space-y-2">
                                <li>If everyone has <code>flex-grow: 1</code>, they split the slice into three equal parts.</li>
                                <li>If one friend has <code>flex-grow: 2</code> and the others have <code>flex-grow: 1</code>, they'd split the slice into four parts, and the greedy friend would get two of those parts!</li>
                            </ul>
                            <pre><code>.item {
  flex-grow: 1; /* This item will grow to take up a share of the free space. */
}

.greedy-item {
  flex-grow: 4; /* This item wants 4 times the share of the free space. */
}</code></pre>
                            <p class="mt-4"><em>Note: Negative numbers are not valid for <code>flex-grow</code>.</em></p>
                        `},
                        { id: 'it11-10-order', name: 'order', content: `
                            <h4>order: Changing the Line-up</h4>
                            <p>Normally, flex items appear in the same order as they are written in the HTML file. The <code>order</code> property is a superpower that lets you change their visual order without touching the HTML!</p>
                            <img src="https://css-tricks.com/wp-content/uploads/2018/10/order.svg" alt="Diagram showing how the order property re-arranges flex items" class="my-6 bg-white p-4 rounded-lg shadow-md">
                            <h5 class="font-semibold mt-6">How it Works:</h5>
                            <p>By default, every flex item has an <code>order</code> value of <code>0</code>. The browser then arranges them from the lowest order number to the highest.</p>
                             <ul class="list-disc list-inside mt-4 space-y-3">
                                <li>An item with <code>order: -1;</code> will appear before any items with the default <code>order: 0;</code>.</li>
                                <li>An item with <code>order: 1;</code> will appear after any items with <code>order: 0;</code>.</li>
                                <li>If multiple items have the same <code>order</code> value, they will be arranged among themselves based on their original source order in the HTML.</li>
                            </ul>
                            <pre><code>.item-1 { order: 2; } /* This will appear third (or last) */
.item-2 { order: -1; } /* This will appear first */
.item-3 { order: 1; } /* This will appear second */</code></pre>
                            <p class="mt-4">This property is extremely useful for responsive design, where you might want to show elements in a different order on a mobile screen compared to a desktop screen.</p>
                        `},
                        { id: 'it11-10-activity', name: 'Mini Project: Navbar', content: `
                            <h4>Mini Project: Build a Responsive Navbar</h4>
                            <p>Let's use everything we've learned to build a common and essential website component: a navigation bar.</p>
                            <h5 class="font-semibold mt-6">Step 1: The HTML Structure</h5>
                            <p>In your <code>index.html</code>, add this structure inside your <code>&lt;header&gt;</code> tag.</p>
                            <pre><code>&lt;header&gt;
    &lt;nav class="navbar"&gt;
        &lt;div class="logo"&gt;MySite&lt;/div&gt;
        &lt;div class="nav-links"&gt;
            &lt;a href="#"&gt;Home&lt;/a&gt;
            &lt;a href="#"&gt;About&lt;/a&gt;
            &lt;a href="#"&gt;Services&lt;/a&gt;
        &lt;/div&gt;
        &lt;div class="contact-button"&gt;
            &lt;a href="#"&gt;Contact Us&lt;/a&gt;
        &lt;/div&gt;
    &lt;/nav&gt;
&lt;/header&gt;</code></pre>
                            <h5 class="font-semibold mt-6">Step 2: The CSS Styling</h5>
                            <p>In your <code>style.css</code>, let's bring it to life with Flexbox.</p>
                            <pre><code>/* 1. Turn the navbar into a flex container */
.navbar {
    display: flex;
    justify-content: space-between; /* This is key! Pushes logo/links and button apart */
    align-items: center; /* Vertically centers all items */
    background-color: #2c3e50;
    padding: 1rem 2rem;
    color: white;
}

/* 2. Style the logo */
.logo {
    font-size: 1.5rem;
    font-weight: bold;
}

/* 3. Style the navigation links */
.nav-links a {
    color: white;
    text-decoration: none;
    margin: 0 1rem; /* Adds space between the links */
    font-size: 1rem;

            const mainContentContainer = document.getElementById('main-content-container');
            const sidebarMenu = document.getElementById('sidebar-menu');

            function renderMeeting(meetingId) {
                const meeting = meetingsData[meetingId];
                if (!meeting) {
                    mainContentContainer.innerHTML = `<div class="card"><p>Meeting not found.</p></div>`;
                    return;
                }

                let htmlContent = `
                    <header class="mb-8">
                        <h2 class="text-4xl font-bold text-gray-800">${meeting.title}</h2>
                        <h3 class="text-xl text-gray-500 mt-2">${meeting.subtitle}</h3>
                    </header>
                    <div class="card">
                        <div class="flex overflow-x-auto border-b border-gray-200 mb-6 pb-1 hide-scrollbar">
                `;

                meeting.tabs.forEach((tab, index) => {
                    const activeClass = index === 0 ? 'active' : '';
                    htmlContent += `<button class="tab-button flex-shrink-0 mr-4 ${activeClass}" data-tab="${tab.id}">${tab.name}</button>`;
                });

                htmlContent += `</div><div class="prose max-w-none">`;

                meeting.tabs.forEach((tab, index) => {
                    const activeClass = index === 0 ? 'active' : '';
                    htmlContent += `<div id="${tab.id}" class="tab-content ${activeClass}">${tab.content}</div>`;
                });

                htmlContent += `</div></div>`;
                mainContentContainer.innerHTML = htmlContent;

                const tabButtons = mainContentContainer.querySelectorAll('.tab-button');
                const tabContents = mainContentContainer.querySelectorAll('.tab-content');

                tabButtons.forEach(button => {
                    button.addEventListener('click', () => {
                        tabButtons.forEach(btn => btn.classList.remove('active'));
                        tabContents.forEach(content => content.classList.remove('active'));

                        button.classList.add('active');
                        document.getElementById(button.dataset.tab).classList.add('active');
                    });
                });

                // Attach event listeners for internal accordions within the active tab
                const internalAccordions = mainContentContainer.querySelectorAll('.internal-accordion-btn');
                internalAccordions.forEach(button => {
                    button.addEventListener('click', () => {
                        const content = button.nextElementSibling;
                        content.classList.toggle('hidden');
                        button.textContent = content.classList.contains('hidden') ? 'Show Breakdown ▼' : 'Hide Breakdown ▲';
                    });
                });
            }

            const accordionHeaders = document.querySelectorAll('.accordion-header');
            accordionHeaders.forEach(header => {
                header.addEventListener('click', () => {
                    header.nextElementSibling.classList.toggle('active');
                });
            });

            sidebarMenu.addEventListener('click', (event) => {
                const target = event.target.closest('a');
                if (target && target.dataset.meetId) {
                    event.preventDefault();
                    
                    sidebarMenu.querySelectorAll('a').forEach(link => link.classList.remove('active'));
                    target.classList.add('active');

                    renderMeeting(target.dataset.meetId);
                }
            });
            
            renderMeeting('landing-page');
            sidebarMenu.querySelector('a[data-meet-id="landing-page"]').classList.add('active');
        });
    </script>
